<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Anime Feature — MG Master Hub</title><link rel="stylesheet" href="style.css?v=7"></head><body><header class="site-header app-shell"><a class="brand" href="index.html">⚡ MG Master Hub</a><div class="profile-area" id="profileArea"><a class="profile-btn" href="login.html" id="profileButton"><span class="avatar-fallback" id="avatarFallback">👤</span><img id="profileAvatar" class="profile-avatar" alt="Profile photo" hidden><span class="profile-name" id="profileName">Login</span></a><div class="profile-menu" id="profileMenu" hidden><div class="profile-menu-user"><img id="menuAvatar" class="menu-avatar" alt="Profile photo" hidden><div><strong id="menuName">Guest</strong><small id="menuEmail">Not signed in</small></div></div><a href="login.html">Account</a><button id="menuLogout" type="button" hidden>Log out</button></div></div></header><main class="app-shell"><section class="hero compact"><div class="badge" id="badge">🎌 ANIME</div><h1 id="title">Anime<br><span>feature.</span></h1><p id="intro">Loading…</p><div class="actions"><a class="btn secondary" href="anime.html">← Anime Hub</a><a class="btn secondary" href="anime-search.html">🔎 Search</a></div></section><section class="modules"><div id="status"></div><div id="controls" class="feature-controls"></div><div id="results" class="anime-grid"></div></section></main><script type="module">import{fetchJikan,animeCard,escapeHtml}from './app.js?v=7';const feature=new URLSearchParams(location.search).get('feature')||'new',title=document.getElementById('title'),intro=document.getElementById('intro'),badge=document.getElementById('badge'),status=document.getElementById('status'),results=document.getElementById('results'),controls=document.getElementById('controls');const saved=()=>JSON.parse(localStorage.getItem('mgAnimeSubscriptions')||'[]');const save=x=>localStorage.setItem('mgAnimeSubscriptions',JSON.stringify(x));const configs={new:['🆕 NEW RELEASES','New releases.','Browse currently airing and recently released anime.'],trending:['🔥 TRENDING','Trending anime.','Popular titles from Jikan.'],countdown:['⏳ COUNTDOWN','Release<br><span>countdown.</span>','Upcoming broadcast information when Jikan provides it.'],language:['🌐 LANGUAGE RELEASES','Language<br><span>releases.</span>','Choose a language preference and save anime subscriptions.'],subscribed:['🔔 SUBSCRIBED','Your<br><span>anime.</span>','Your saved anime subscriptions on this browser.']};const c=configs[feature]||configs.new;badge.textContent=c[0];title.innerHTML=c[1];intro.textContent=c[2];
function subscribe(a,lang='Japanese'){const list=saved();const id=a.mal_id;if(!list.some(x=>x.id===id)){list.push({id,title:a.title_english||a.title||'Unknown',language:lang,added:Date.now()});save(list)}renderSavedMessage(id)}function renderSavedMessage(id){const el=document.getElementById(`save-${id}`);if(el)el.textContent='✓ Subscribed'}
async function load(){try{if(feature==='subscribed'){const list=saved();status.textContent=list.length?`${list.length} subscribed anime`:'No subscriptions yet. Search an anime and subscribe to it.';results.innerHTML=list.map(x=>`<article class="anime-card"><div class="anime-card-copy"><h3>${escapeHtml(x.title)}</h3><p>Language: ${escapeHtml(x.language)}</p><button class="btn secondary" data-remove="${x.id}">Remove</button></div></article>`).join('');results.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{save(saved().filter(x=>x.id!==Number(b.dataset.remove)));load()});return}let data=[];if(feature==='trending')data=await fetchJikan('/top/anime?limit=12');else if(feature==='countdown')data=await fetchJikan('/anime?status=airing&order_by=popularity&sort=asc&limit=12');else data=await fetchJikan('/anime?status=airing&order_by=popularity&sort=asc&limit=12');status.textContent=`${data.length} titles`;const languages=['Japanese','English','Hindi','Bengali','Other'];results.innerHTML=data.map(a=>{const extra=feature==='language'?`<div class="lang-row">${languages.map(l=>`<button class="lang-btn" data-id="${a.mal_id}" data-lang="${l}">${l}</button>`).join('')}</div>`:`<button class="btn secondary save-btn" id="save-${a.mal_id}">🔔 Subscribe</button>`;return animeCard(a,extra)}).join('');results.querySelectorAll('.save-btn').forEach(b=>b.onclick=()=>{const id=Number(b.id.replace('save-',''));const a=data.find(x=>x.mal_id===id);subscribe(a);b.textContent='✓ Subscribed'});results.querySelectorAll('.lang-btn').forEach(b=>b.onclick=()=>{const a=data.find(x=>x.mal_id===Number(b.dataset.id));subscribe(a,b.dataset.lang);b.textContent='✓ '+b.dataset.lang});}catch(e){console.error(e);status.textContent='Could not load this feature right now. Please try again.'}}load();</script></body></html>
