name: Anime Notifications

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        type: choice
        options:
          - check
          - test
          - owner-message
        default: check
      title:
        description: 'Owner message title (only for owner-message)'
        required: false
        type: string
        default: 'MG Master Hub'
      message:
        description: 'Owner message body (only for owner-message)'
        required: false
        type: string
        default: ''
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read

concurrency:
  group: anime-notifications
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Firebase Admin SDK
        run: npm install --no-save --no-package-lock firebase-admin@14.3.0

      - name: Run notification service
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NOTIFICATION_MODE: ${{ github.event.inputs.mode || 'check' }}
          OWNER_MESSAGE_TITLE: ${{ github.event.inputs.title || '' }}
          OWNER_MESSAGE_BODY: ${{ github.event.inputs.message || '' }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: node scripts/anime-notifications.js
