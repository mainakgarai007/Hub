<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Anime Pulse — follow anime and see important updates in one place."><title>Anime Pulse — MG Master Hub</title><link rel="stylesheet" href="style.css?v=27"><style>.pulse-filter{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.pulse-filter button.active{outline:2px solid #7c8cff}.pulse-item{margin-bottom:14px}.pulse-meta{opacity:.72;font-size:.9rem}.pulse-empty{padding:22px}.pulse-update{border-left:3px solid #7c8cff;padding-left:12px;margin-top:12px}.pulse-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.pulse-news{border-left-color:#f4c95d}.pulse-news a{word-break:break-word}.pulse-progress{margin:10px 0;padding:10px 12px;border:1px solid #29344b;border-radius:12px;background:#0d1220;opacity:.9}</style></head><body><header class="site-header app-shell"><a class="brand" href="index.html">⚡ MG Master Hub</a><div class="profile-area" id="profileArea"><a class="profile-btn" href="login.html" id="profileButton" aria-label="Open profile"><span class="avatar-fallback" id="avatarFallback">👤</span><img id="profileAvatar" class="profile-avatar" alt="Profile photo" hidden><span class="profile-name" id="profileName">Login</span></a><div class="profile-menu" id="profileMenu" hidden><div class="profile-menu-user"><img id="menuAvatar" class="menu-avatar" alt="Profile photo" hidden><div><strong id="menuName">Guest</strong><small id="menuEmail">Not signed in</small></div></div><a href="login.html">Account</a><button id="menuLogout" type="button" hidden>Log out</button></div></div></header><main class="app-shell"><section class="hero compact"><div class="badge">📡 ANIME PULSE</div><h1>Every update.<br><span>One place.</span></h1><p>Followed anime updates, next episodes, season changes, status changes and real anime news.</p><div class="actions"><a class="btn secondary" href="anime.html">← Anime Hub</a><a class="btn secondary" href="anime-search.html">🔎 Add Anime</a></div></section><section class="modules"><div class="pulse-filter"><button class="btn secondary active" data-filter="all">All</button><button class="btn secondary" data-filter="episode">Episodes</button><button class="btn secondary" data-filter="news">News</button><button class="btn secondary" data-filter="status">Status</button></div><div id="status" aria-live="polite">Loading your Anime Pulse…</div><div id="progress"></div><div id="feed"></div></section></main><script type="module">import{getCurrentUser,loadSubscriptions,saveSubscription,deleteSubscription,escapeHtml}from'./anime-api.js?v=10';const status=document.getElementById('status'),feed=document.getElementById('feed'),progress=document.getElementById('progress');let items=[],filter='all',loadedSubs=[];const localKey='mgAnimeSubscriptions',cacheKey='mgAnimePulseCacheV2',CACHE_TTL=5*60*1000;function localSubs(){try{const x=JSON.parse(localStorage.getItem(localKey)||'[]');return Array.isArray(x)?x:[]}catch{return[]}}function pulseCache(){try{const x=JSON.parse(localStorage.getItem(cacheKey)||'{}');return x&&typeof x==='object'?x:{}}catch{return{}}}function setPulseCache(x){try{localStorage.setItem(cacheKey,JSON.stringify(x))}catch{}}function fmtDate(v){if(!v)return'';let d;if(typeof v==='object'&&v.year)d=new Date(v.year,(v.month||1)-1,v.day||1);else d=new Date(v);return Number.isNaN(d.getTime())?'':`${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`}function ts(v){if(!v)return Date.now();if(typeof v==='object'&&v.year)return new Date(v.year,(v.month||1)-1,v.day||1).getTime();const n=Number(v);if(Number.isFinite(n))return n;const d=new Date(v).getTime();return Number.isFinite(d)?d:Date.now()}function fmtDateTime(v){const d=new Date(ts(v));return`${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')} ${d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}`}function esc(v){return escapeHtml(v??'')}let jikanChain=Promise.resolve(),nextJikan=0;function jikan(path){const job=jikanChain.then(async()=>{const wait=Math.max(0,nextJikan-Date.now());if(wait)await new Promise(r=>setTimeout(r,wait));nextJikan=Date.now()+650;const r=await fetch(`https://api.jikan.moe/v4${path}`,{headers:{Accept:'application/json'}});if(!r.ok)throw new Error(`Jikan ${r.status}`);return r.json()});jikanChain=job.catch(()=>{});return job}function normalize(a){const b=a.broadcast||{};return{id:`anime:mal:${a.mal_id}`,malId:a.mal_id,title:a.title||a.title_japanese||'Unknown title',englishTitle:a.title_english||null,image:a.images?.jpg?.large_image_url||a.images?.jpg?.image_url||'',score:a.score??null,year:a.year??a.aired?.prop?.from?.year??'—',type:a.type||'Anime',status:a.status||'Unknown',synopsis:a.synopsis||'',genres:(a.genres||[]).map(x=>x?.name).filter(Boolean),episodes:a.episodes??null,duration:a.duration??null,startDate:a.aired?.from||null,endDate:a.aired?.to||null,season:a.season||null,seasonYear:a.year??null,nextEpisodeAt:null,nextEpisode:null,broadcastDay:b.day||null,broadcastTime:b.time||null,broadcastTimezone:b.timezone||'Asia/Tokyo',provider:'jikan',relations:a.relations||[]}}function nextBroadcast(day,time,tz='Asia/Tokyo'){if(!day||!time)return null;const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],target=days.indexOf(day);if(target<0)return null;const m=String(time).match(/^(\d{1,2}):(\d{2})/);if(!m)return null;const now=new Date();let delta=(target-now.getDay()+7)%7;const base=new Date(now);base.setDate(now.getDate()+delta);const y=base.getUTCFullYear(),mo=base.getUTCMonth(),d=base.getUTCDate();const probe=new Date(Date.UTC(y,mo,d,Number(m[1]),Number(m[2])));let offset=0;try{const parts=new Intl.DateTimeFormat('en-US',{timeZone:tz,timeZoneName:'shortOffset',hour:'2-digit'}).formatToParts(probe);const z=parts.find(x=>x.type==='timeZoneName')?.value||'GMT';const mm=z.match(/GMT([+-])(\d{1,2})(?::(\d{2}))?/);if(mm)offset=(mm[1]==='-'?-1:1)*(Number(mm[2])*60+Number(mm[3]||0))}catch{}let candidate=Date.UTC(y,mo,d,Number(m[1]),Number(m[2]))-offset*60000;if(candidate<=Date.now())candidate+=7*86400000;return candidate}function makeUpdates(sub,a){const out=[],name=a.englishTitle||a.title||sub.title||'Anime';if(a.status==='Currently Airing'){const nextAt=nextBroadcast(a.broadcastDay,a.broadcastTime,a.broadcastTimezone);if(nextAt){const ep=Number.isFinite(Number(a.episodes))?Number(a.episodes)+1:null;out.push({type:'episode',date:nextAt,title:ep?`Episode ${ep} next`:'Next episode scheduled',text:`Expected ${fmtDateTime(nextAt)} · ${a.broadcastDay} ${a.broadcastTime}${a.broadcastTimezone?` · ${a.broadcastTimezone}`:''}.`,animeId:a.malId,name})}out.push({type:'status',date:Date.now(),title:'Currently airing',text:`Release date: ${fmtDate(a.startDate)||'Release date not available'} · End date: ${fmtDate(a.endDate)||'End date not available'}.`,animeId:a.malId,name})}const release=fmtDate(a.startDate)||'Release date not available',end=fmtDate(a.endDate)||'End date not available';if(a.status==='Discontinued'||String(a.status).toLowerCase().includes('cancel'))out.push({type:'status',date:ts(a.endDate||a.startDate),title:'Anime was discontinued',text:`Release date: ${release} · End date: ${end}.`,animeId:a.malId,name});else if(a.status!=='Currently Airing')out.push({type:'status',date:ts(a.endDate||a.startDate),title:`Status: ${a.status||'Unknown'}`,text:`Release date: ${release} · End date: ${end}${a.season?` · ${a.season} ${a.seasonYear||''}`:''}.`,animeId:a.malId,name});return out}function makeNews(sub,news){return(news||[]).map(n=>({type:'news',date:n.date||Date.now(),title:n.title||'Anime news',text:n.excerpt||'New anime news is available.',url:n.url||'',animeId:sub.malId||null,name:sub.title||'Anime'}))}async function getSubs(){const local=localSubs();try{const u=await getCurrentUser();if(!u)return local;try{const cloud=await loadSubscriptions();return Array.isArray(cloud)?cloud:local}catch{return local}}catch{return local}}async function advanceSeason(sub,a){if(!String(a.status).toLowerCase().includes('finished'))return null;const rel=(a.relations||[]).find(x=>String(x.relation||'').toLowerCase()==='sequel'&&x.entry?.mal_id);if(!rel)return null;const next=normalize((await jikan(`/anime/${rel.entry.mal_id}/full`)).data);const updated={...sub,id:next.id,malId:next.malId,title:next.englishTitle||next.title||sub.title,source:'jikan',added:sub.added||Date.now(),updated:Date.now()};try{await saveSubscription(updated);if(String(sub.id)!==String(updated.id))await deleteSubscription(sub.id)}catch{const list=localSubs().filter(x=>String(x.id)!==String(sub.id));const i=list.findIndex(x=>String(x.id)===String(updated.id));if(i>=0)list[i]=updated;else list.push(updated);localStorage.setItem(localKey,JSON.stringify(list))}return next}function render(){const visible=items.filter(x=>filter==='all'||x.type===filter).sort((a,b)=>(b.date||0)-(a.date||0));status.textContent=`${visible.length} update${visible.length===1?'':'s'} from your anime`;feed.innerHTML=visible.length?visible.map(x=>`<article class="anime-card pulse-item"><div class="anime-card-copy"><div class="badge">${x.type==='episode'?'⏳ NEXT EPISODE':x.type==='news'?'📰 NEWS':'📌 STATUS'}</div><h3>${esc(x.name)}</h3><div class="pulse-update ${x.type==='news'?'pulse-news':''}"><strong>${esc(x.title)}</strong><p>${esc(x.text)}</p><div class="pulse-meta">${esc(fmtDateTime(x.date))}</div>${x.url?`<div class="pulse-actions"><a class="btn secondary" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">Read news ↗</a></div>`:''}</div><div class="pulse-actions">${x.animeId?`<a class="btn secondary" href="anime-detail.html?id=${encodeURIComponent(x.animeId)}">Details</a>`:''}</div></div></article>`).join(''):'<article class="anime-card pulse-empty"><div class="anime-card-copy"><h3>No updates in this filter</h3><p>Try All, Episodes, News, or Status.</p></div></article>'}function showProgress(text){progress.innerHTML=`<div class="pulse-progress">${esc(text)}</div>`}async function loadNews(){const missing=loadedSubs.filter(x=>{const c=pulseCache()[String(x.malId)];return !c?.news||Date.now()-c.newsAt>CACHE_TTL});if(!missing.length)return;showProgress(`📰 Refreshing news for ${missing.length} anime…`);await Promise.all(missing.map(async sub=>{try{const n=await jikan(`/anime/${sub.malId}/news?limit=3`);const c=pulseCache();c[String(sub.malId)]={...(c[String(sub.malId)]||{}),news:makeNews(sub,n.data||[]),newsAt:Date.now()};setPulseCache(c)}catch{}}));items=[];for(const sub of loadedSubs){const c=pulseCache()[String(sub.malId)];if(c?.details)items.push(...c.details);if(c?.news)items.push(...c.news)}render();showProgress(`✓ ${loadedSubs.length} followed anime checked. News and status are up to date where providers responded.`)}async function load(){status.textContent='Loading your Anime Pulse…';progress.innerHTML='';feed.innerHTML='';try{loadedSubs=(await getSubs()).slice(0,12);if(!loadedSubs.length){status.textContent='No followed anime yet.';feed.innerHTML='<article class="anime-card pulse-empty"><div class="anime-card-copy"><h3>📡 Start your Anime Pulse</h3><p>Open Search → choose an anime → tap Subscribe.</p><a class="btn primary" href="anime-search.html">Search Anime</a></div></article>';return}items=[];const cache=pulseCache();let ready=0;for(const sub of loadedSubs){const id=Number(sub.malId||String(sub.id||'').replace('anime:mal:',''));if(!Number.isInteger(id)||id<1)continue;const c=cache[String(id)];if(c?.details&&Date.now()-c.detailsAt<CACHE_TTL)items.push(...c.details);ready++}render();showProgress(`⚡ ${ready}/${loadedSubs.length} anime loaded from cache. Checking latest data…`);const pending=loadedSubs.filter(sub=>{const id=Number(sub.malId||String(sub.id||'').replace('anime:mal:',''));const c=cache[String(id)];return Number.isInteger(id)&&id>0&&(!c?.details||Date.now()-c.detailsAt>=CACHE_TTL)});await Promise.all(pending.map(async sub=>{const id=Number(sub.malId||String(sub.id||'').replace('anime:mal:',''));try{let a=normalize((await jikan(`/anime/${id}/full`)).data);if(String(a.status).toLowerCase().includes('finished')){try{const next=await advanceSeason(sub,a);if(next){items.push({type:'status',date:Date.now(),title:`Season ended → now following ${next.englishTitle||next.title||'next season'}`,text:`Automatically moved this subscription to the next season. Release date: ${fmtDate(next.startDate)||'Release date not available'}.`,animeId:next.malId,name:next.englishTitle||next.title||sub.title});a=next}}catch{}}const detailItems=makeUpdates(sub,a),cc=pulseCache();cc[String(id)]={...(cc[String(id)]||{}),details:detailItems,detailsAt:Date.now()};setPulseCache(cc);items.push(...detailItems);ready++;render();showProgress(`⚡ ${ready}/${loadedSubs.length} anime checked…`)}catch{ready++;render();showProgress(`⚠️ ${ready}/${loadedSubs.length} anime checked. Some provider data is temporarily unavailable.`)}}));render();showProgress(`✓ ${loadedSubs.length} followed anime checked. Episode/status data is ready.`);if(filter==='all'||filter==='news')await loadNews()}catch(e){console.error(e);status.textContent='Your subscriptions could not be read.';feed.innerHTML='<article class="anime-card pulse-empty"><div class="anime-card-copy"><h3>📡 Pulse needs a refresh</h3><p>Your saved subscriptions were not deleted.</p><button class="btn primary" id="retryBtn">Retry</button></div></article>';document.getElementById('retryBtn').onclick=load}}document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=async()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render();if(filter==='all'||filter==='news')await loadNews()});load();</script><script type="module" src="auth-ui.js?v=10"></script></body></html>
