<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Search anime with details, subscriptions and provider fallbacks."><title>Anime Search — MG Master Hub</title><link rel="stylesheet" href="style.css?v=18"></head><body><header class="site-header app-shell"><a class="brand" href="index.html">⚡ MG Master Hub</a><div class="profile-area" id="profileArea"><a class="profile-btn" href="login.html" id="profileButton" aria-label="Open profile"><span class="avatar-fallback" id="avatarFallback">👤</span><img id="profileAvatar" class="profile-avatar" alt="Profile photo" hidden><span class="profile-name" id="profileName">Login</span></a><div class="profile-menu" id="profileMenu" hidden><div class="profile-menu-user"><img id="menuAvatar" class="menu-avatar" alt="Profile photo" hidden><div><strong id="menuName">Guest</strong><small id="menuEmail">Not signed in</small></div></div><a href="login.html">Account</a><button id="menuLogout" type="button" hidden>Log out</button></div></div></header><main class="app-shell"><section class="hero compact"><div class="badge">🔎 ANIME SEARCH</div><h1>Find your<br><span>anime.</span></h1><p>Search anime, open full details, view recommendations and subscribe.</p><form id="searchForm" class="search-box"><label class="sr-only" for="query">Anime title</label><input id="query" required maxlength="80" placeholder="Search anime..." autocomplete="off"><button class="btn primary" id="searchButton" type="submit">Search</button></form><div class="actions"><a class="btn secondary" href="anime.html">← Anime Hub</a></div></section><section class="modules"><div id="status" aria-live="polite">Search for an anime to begin.</div><div id="results" class="anime-grid"></div></section></main><script type="module">import{searchAnime,animeCard,getAnimeId,escapeHtml,getCurrentUser,saveSubscription,loadSubscriptions}from'./app.js?v=18';const form=document.getElementById('searchForm'),query=document.getElementById('query'),results=document.getElementById('results'),status=document.getElementById('status'),button=document.getElementById('searchButton');let activeData=[];const localKey='mgAnimeSubscriptions';const localSaved=()=>{try{const v=JSON.parse(localStorage.getItem(localKey)||'[]');return Array.isArray(v)?v:[]}catch{return[]}};const localSave=x=>localStorage.setItem(localKey,JSON.stringify(x));const getSubs=async()=>{try{const u=await getCurrentUser();if(u)return await loadSubscriptions()}catch{}return localSaved()};const subscribe=async a=>{const id=getAnimeId(a),item={id,title:a.englishTitle||a.title||'Unknown',language:'Japanese',reminder:'1 hour',newEpisode:true,news:false,trailer:false,added:Date.now(),source:a.provider||'unknown'};try{const u=await getCurrentUser();if(u){await saveSubscription(item);return true}}catch{}const list=localSaved();const i=list.findIndex(x=>String(x.id)===String(id));if(i>=0)list[i]=item;else list.push(item);localSave(list);return false};const render=async()=>{const subs=await getSubs();results.innerHTML=activeData.map(a=>{const id=getAnimeId(a),active=subs.some(x=>String(x.id)===String(id));const extra=`<div class="card-actions"><button class="btn secondary save-btn" type="button" data-id="${escapeHtml(id)}" aria-pressed="${active}">${active?'✓ Subscribed':'🔔 Subscribe'}</button><a class="btn secondary" href="anime-detail.html?id=${encodeURIComponent(a.malId||'')}">Details</a></div>`;return animeCard(a,extra)}).join('');results.querySelectorAll('.save-btn').forEach(b=>b.onclick=async()=>{const a=activeData.find(x=>String(getAnimeId(x))===String(b.dataset.id));if(!a)return;b.disabled=true;const cloud=await subscribe(a);b.disabled=false;b.textContent='✓ Subscribed';b.setAttribute('aria-pressed','true');if(!cloud)status.textContent='Saved locally. Sign in to sync across devices.'})};form.addEventListener('submit',async e=>{e.preventDefault();const q=query.value.trim();if(!q)return;button.disabled=true;button.textContent='Searching…';status.textContent='Searching anime…';results.innerHTML='';activeData=[];try{activeData=await searchAnime(q);status.textContent=activeData.length?`${activeData.length} results found`:'No anime found. Try another spelling.';await render()}catch(err){console.error(err);status.textContent='Anime search failed. Please try again shortly.'}finally{button.disabled=false;button.textContent='Search'}});</script><script type="module" src="auth-ui.js?v=3"></script></body></html>
