<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Anime Pulse — follow anime and see important updates in one place.">
<title>Anime Pulse — MG Master Hub</title>
<link rel="stylesheet" href="style.css?v=30">
<style>
.pulse-filter{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.pulse-filter button.active{outline:2px solid #7c8cff}.pulse-item{margin-bottom:14px}.pulse-meta{opacity:.72;font-size:.9rem}.pulse-empty{padding:22px}.pulse-update{border-left:3px solid #7c8cff;padding-left:12px;margin-top:12px}.pulse-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.pulse-news{border-left-color:#f4c95d}.pulse-progress{margin:10px 0;padding:10px 12px;border:1px solid #29344b;border-radius:12px;background:#0d1220;opacity:.9}.pulse-error{border-left:3px solid #e58a8a;padding-left:12px}.pulse-muted{opacity:.72}
</style>
</head>
<body>
<header class="site-header app-shell"><a class="brand" href="index.html">⚡ MG Master Hub</a><div class="profile-area" id="profileArea"><a class="profile-btn" href="login.html" id="profileButton" aria-label="Open profile"><span class="avatar-fallback" id="avatarFallback">👤</span><img id="profileAvatar" class="profile-avatar" alt="Profile photo" hidden><span class="profile-name" id="profileName">Login</span></a><div class="profile-menu" id="profileMenu" hidden><div class="profile-menu-user"><img id="menuAvatar" class="menu-avatar" alt="Profile photo" hidden><div><strong id="menuName">Guest</strong><small id="menuEmail">Not signed in</small></div></div><a href="login.html">Account</a><button id="menuLogout" type="button" hidden>Log out</button></div></div></header>
<main class="app-shell"><section class="hero compact"><div class="badge">📡 ANIME PULSE</div><h1>Every update.<br><span>One place.</span></h1><p>Followed anime updates, next episodes, season changes, status changes and real anime news.</p><div class="actions"><a class="btn secondary" href="anime.html">← Anime Hub</a><a class="btn secondary" href="anime-search.html">🔎 Add Anime</a></div></section>
<section class="modules"><div class="pulse-filter"><button class="btn secondary active" data-filter="all">All</button><button class="btn secondary" data-filter="episode">Episodes</button><button class="btn secondary" data-filter="news">News</button><button class="btn secondary" data-filter="status">Status</button></div><div id="status" aria-live="polite">Loading your Anime Pulse…</div><div id="progress"></div><div id="feed"></div></section></main>
<script type="module">
import{getCurrentUser,loadSubscriptions,fetchAnimeDetails,fetchAnimeNews,anilistList,escapeHtml}from'./anime-api.js?v=13';
const status=document.getElementById('status'),feed=document.getElementById('feed'),progressBox=document.getElementById('progress');
let items=[],filter='all',loadedSubs=[];const LOCAL='mgAnimeSubscriptions',CACHE='mgAnimePulseCacheV5',TTL=5*60*1000;
const esc=v=>escapeHtml(v??'');
function localSubs(){try{const x=JSON.parse(localStorage.getItem(LOCAL)||'[]');return Array.isArray(x)?x:[]}catch{return[]}}
function cacheGet(){try{const x=JSON.parse(localStorage.getItem(CACHE)||'{}');return x&&typeof x==='object'?x:{}}catch{return{}}}
function cacheSet(x){try{localStorage.setItem(CACHE,JSON.stringify(x))}catch{}}
function date(v){if(!v)return'';if(typeof v==='object'&&v.year)return`${String(v.day||1).padStart(2,'0')}/${String(v.month||1).padStart(2,'0')}/${v.year}`;const d=new Date(v);return Number.isNaN(d.getTime())?'':`${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`}
function ms(v){if(!v)return 0;if(typeof v==='object'&&v.year)return new Date(v.year,(v.month||1)-1,v.day||1).getTime();const n=Number(v);if(Number.isFinite(n))return n;const d=new Date(v).getTime();return Number.isFinite(d)?d:0}
function dt(v){const d=new Date(ms(v));return Number.isNaN(d.getTime())?'':`${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')} ${d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}`}
function subId(s){const n=Number(s?.malId);if(Number.isInteger(n)&&n>0)return n;const m=String(s?.id||'').match(/^anime:mal:(\d+)$/);return m?Number(m[1]):null}
function fallbackItem(s){return{type:'status',date:Date.now(),name:s.title||'Followed anime',title:'Following',text:'This anime is saved in your Anime Pulse. Latest provider data is being refreshed.',animeId:subId(s)}}
async function getSubs(){const local=localSubs();try{const u=await getCurrentUser();if(!u)return local;const cloud=await loadSubscriptions();return Array.isArray(cloud)&&cloud.length?cloud:local}catch{return local}}
function makeUpdates(s,a){const out=[],id=a.malId||subId(s),name=a.englishTitle||a.title||s.title||'Anime',st=String(a.status||'Unknown'),next=ms(a.nextEpisodeAt);if(st.toLowerCase()==='currently airing'){if(next>Date.now())out.push({type:'episode',date:next,name,title:Number.isFinite(Number(a.nextEpisode))?`Episode ${a.nextEpisode} next`:'Next episode scheduled',text:`Next episode: ${dt(next)}.`,animeId:id});else if(a.broadcastDay&&a.broadcastTime)out.push({type:'episode',date:Date.now(),name,title:'Next episode schedule available',text:`Usually airs ${a.broadcastDay} at ${a.broadcastTime}${a.broadcastTimezone?' · '+a.broadcastTimezone:''}.`,animeId:id})}else out.push({type:'status',date:ms(a.endDate||a.startDate)||Date.now(),name,title:st==='Discontinued'||st.toLowerCase().includes('cancel')?'Anime was discontinued':`Status: ${st}`,text:`Release date: ${date(a.startDate)||'Release date not available'} · End date: ${date(a.endDate)||'End date not available'}${a.season?' · '+a.season+' '+(a.seasonYear||''):''}.`,animeId:id});return out}
function makeNews(s,news){return(news||[]).map(n=>({type:'news',date:ms(n.date)||Date.now(),name:s.title||'Anime',title:n.title||'Anime news',text:n.excerpt||'New anime news is available.',url:n.url||'',animeId:subId(s)}))}
function render(){const visible=items.filter(x=>filter==='all'||x.type===filter).sort((a,b)=>(b.date||0)-(a.date||0));status.textContent=`${visible.length} update${visible.length===1?'':'s'} from your anime`;feed.innerHTML=visible.length?visible.map(x=>`<article class="anime-card pulse-item"><div class="anime-card-copy"><div class="badge">${x.type==='episode'?'⏳ NEXT EPISODE':x.type==='news'?'📰 NEWS':'📌 STATUS'}</div><h3>${esc(x.name)}</h3><div class="pulse-update ${x.type==='news'?'pulse-news':''}"><strong>${esc(x.title)}</strong><p>${esc(x.text)}</p>${x.date?`<div class="pulse-meta">${esc(dt(x.date))}</div>`:''}${x.url?`<div class="pulse-actions"><a class="btn secondary" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">Read news ↗</a></div>`:''}</div>${x.animeId?`<div class="pulse-actions"><a class="btn secondary" href="anime-detail.html?id=${encodeURIComponent(x.animeId)}">Details</a></div>`:''}</div></article>`).join(''):'<article class="anime-card pulse-empty"><div class="anime-card-copy"><h3>No updates in this filter</h3><p>Try All, Episodes, News, or Status.</p></div></article>'}
function showProgress(t){progressBox.innerHTML=`<div class="pulse-progress">${esc(t)}</div>`}
async function refreshOne(s){const id=subId(s);if(!id){try{const r=await anilistList({search:s.title||'',perPage:1});return r[0]||null}catch{return null}}try{return await fetchAnimeDetails(id)}catch{return null}}
async function loadNews(){if(!loadedSubs.length)return;const c=cacheGet(),pending=loadedSubs.filter(s=>{const id=subId(s),x=id?c[String(id)]:null;return id&&(!x?.newsAt||Date.now()-x.newsAt>TTL)});if(pending.length)await Promise.all(pending.map(async s=>{const id=subId(s);if(!id)return;try{const n=await fetchAnimeNews(id,3),cc=cacheGet();cc[String(id)]={...(cc[String(id)]||{}),news:makeNews(s,n),newsAt:Date.now()};cacheSet(cc)}catch{}}));items=[];const fresh=cacheGet();loadedSubs.forEach(s=>{const id=subId(s),x=id?fresh[String(id)]:null;if(x?.details)items.push(...x.details);if(x?.news)items.push(...x.news);if(!x?.details&&!x?.news)items.push(fallbackItem(s))});render()}
async function load(){status.textContent='Loading your Anime Pulse…';feed.innerHTML='';progressBox.innerHTML='';try{loadedSubs=(await getSubs()).filter(Boolean).slice(0,12);if(!loadedSubs.length){status.textContent='No followed anime yet.';feed.innerHTML='<article class="anime-card pulse-empty"><div class="anime-card-copy"><h3>📡 Start your Anime Pulse</h3><p>Open Search → choose an anime → tap Subscribe.</p><a class="btn primary" href="anime-search.html">Search Anime</a></div></article>';return}const c=cacheGet();items=[];loadedSubs.forEach(s=>{const id=subId(s),x=id?c[String(id)]:null;if(x?.details&&Date.now()-x.detailsAt<TTL)items.push(...x.details);else items.push(fallbackItem(s))});render();showProgress(`⚡ ${loadedSubs.length} followed anime found. Checking latest data…`);let checked=0;for(const s of loadedSubs){const id=subId(s);if(!id){checked++;continue}const old=cacheGet()[String(id)];if(old?.details&&Date.now()-old.detailsAt<TTL){checked++;continue}const a=await refreshOne(s);if(a){const details=makeUpdates(s,a),cc=cacheGet();cc[String(id)]={...(cc[String(id)]||{}),details,detailsAt:Date.now()};cacheSet(cc);items=items.filter(x=>String(x.animeId)!==String(id));items.push(...details)}checked++;render();showProgress(`⚡ ${checked}/${loadedSubs.length} anime checked…`)}render();showProgress(`✓ ${loadedSubs.length} followed anime checked. Latest data is shown where providers responded.`);if(filter==='all'||filter==='news')await loadNews()}catch(e){console.error(e);status.textContent='Your subscriptions could not be read.';feed.innerHTML='<article class="anime-card pulse-empty"><div class="anime-card-copy"><h3>📡 Pulse needs a refresh</h3><p>Your saved subscriptions were not deleted.</p><button class="btn primary" id="retryBtn">Retry</button></div></article>';document.getElementById('retryBtn').onclick=load}}
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=async()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render();if(filter==='all'||filter==='news')await loadNews()});load();
</script>
<script type="module" src="auth-ui.js?v=12"></script>
</body></html>
