<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Anime discovery, schedules, countdowns, recommendations and subscriptions."><title>Anime Feature — MG Master Hub</title><link rel="stylesheet" href="style.css?v=16"></head><body><header class="site-header app-shell"><a class="brand" href="index.html">⚡ MG Master Hub</a><div class="profile-area" id="profileArea"><a class="profile-btn" href="login.html" id="profileButton" aria-label="Open profile"><span class="avatar-fallback" id="avatarFallback">👤</span><img id="profileAvatar" class="profile-avatar" alt="Profile photo" hidden><span class="profile-name" id="profileName">Login</span></a><div class="profile-menu" id="profileMenu" hidden><div class="profile-menu-user"><img id="menuAvatar" class="menu-avatar" alt="Profile photo" hidden><div><strong id="menuName">Guest</strong><small id="menuEmail">Not signed in</small></div></div><a href="login.html">Account</a><button id="menuLogout" type="button" hidden>Log out</button></div></div></header><main class="app-shell"><section class="hero compact"><div class="badge" id="badge">🎌 ANIME</div><h1 id="title">Anime<br><span>feature.</span></h1><p id="intro">Loading…</p><div class="actions"><a class="btn secondary" href="anime.html">← Anime Hub</a><a class="btn secondary" href="anime-search.html">🔎 Search</a></div></section><section class="modules"><div id="status" aria-live="polite">Loading…</div><div id="results" class="anime-grid"></div></section></main><script type="module">import{fetchJikan,fetchCountdown,fetchAnimeRecommendations,animeCard,getAnimeId,escapeHtml,getCurrentUser,saveSubscription,deleteSubscription,loadSubscriptions}from'./app.js?v=16';
const feature=new URLSearchParams(location.search).get('feature')||'new',title=document.getElementById('title'),intro=document.getElementById('intro'),badge=document.getElementById('badge'),status=document.getElementById('status'),results=document.getElementById('results');
const configs={new:['🆕 NEW RELEASES','New releases.','Browse currently airing anime.'],schedule:['📅 SCHEDULE','Anime<br><span>schedule.</span>','Upcoming verified episode times from airing data.'],trending:['🔥 TRENDING','Trending anime.','Popular titles from the anime catalog.'],top:['🏆 TOP ANIME','Top<br><span>anime.</span>','Highly ranked anime from the catalog.'],recommendations:['✨ RECOMMENDATIONS','More anime<br><span>to explore.</span>','Open an anime from Search to get title-specific recommendations.'],countdown:['⏳ COUNTDOWN','Release<br><span>countdown.</span>','Verified next-episode countdowns.'],language:['🌐 LANGUAGE','Language<br><span>preferences.</span>','Choose a preferred language for your subscription.'],subscribed:['🔔 MY ANIME','Your<br><span>anime.</span>','Manage subscriptions and notification preferences.']};const c=configs[feature]||configs.new;badge.textContent=c[0];title.innerHTML=c[1];intro.textContent=c[2];
const localKey='mgAnimeSubscriptions';const localSaved=()=>{try{const v=JSON.parse(localStorage.getItem(localKey)||'[]');return Array.isArray(v)?v:[]}catch{return[]}};const localSave=x=>localStorage.setItem(localKey,JSON.stringify(x));
async function subs(){try{const u=await getCurrentUser();if(u)return await loadSubscriptions()}catch(e){}return localSaved()}
async function subscribe(a,lang='Japanese'){const id=getAnimeId(a),item={id,title:a.englishTitle||a.title||'Unknown',language:lang,reminder:'1 hour',newEpisode:true,news:false,trailer:false,added:Date.now(),source:a.provider||'unknown'};try{const u=await getCurrentUser();if(u){await saveSubscription(item);return true}}catch(e){}const list=localSaved(),old=list.find(x=>String(x.id)===String(id));if(old)Object.assign(old,item);else list.push(item);localSave(list);return false}
async function removeSub(id){try{const u=await getCurrentUser();if(u){await deleteSubscription(id);return true}}catch(e){}localSave(localSaved().filter(x=>String(x.id)!==String(id)));return false}
function countdownText(ts){if(!ts)return 'Airing time unavailable';const diff=Math.max(0,ts-Date.now()),s=Math.floor(diff/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),sec=s%60;return `${String(d).padStart(2,'0')}d ${String(h).padStart(2,'0')}h ${String(m).padStart(2,'0')}m ${String(sec).padStart(2,'0')}s`}
async function bind(data){const current=await subs();results.querySelectorAll('.save-btn').forEach(b=>b.onclick=async()=>{const a=data.find(x=>String(getAnimeId(x))===String(b.dataset.id));if(!a)return;b.disabled=true;const cloud=await subscribe(a);b.disabled=false;b.textContent='✓ Subscribed';b.setAttribute('aria-pressed','true');if(!cloud)status.textContent='Saved locally. Sign in to sync across devices.'});results.querySelectorAll('.lang-btn').forEach(b=>b.onclick=async()=>{const a=data.find(x=>String(getAnimeId(x))===String(b.dataset.id));if(!a)return;const cloud=await subscribe(a,b.dataset.lang);b.textContent='✓ '+b.dataset.lang;if(!cloud)status.textContent='Language preference saved locally. Sign in to sync it.'})}
async function load(){results.innerHTML='';status.textContent='Loading…';try{if(feature==='subscribed'){const list=await subs();status.textContent=list.length?`${list.length} subscribed anime`:'No subscriptions yet. Search an anime and subscribe.';results.innerHTML=list.map(x=>`<article class="anime-card"><div class="anime-card-copy"><h3>${escapeHtml(x.title)}</h3><p>Language: ${escapeHtml(x.language||'Japanese')} · Reminder: ${escapeHtml(x.reminder||'Off')}</p><p>${x.newEpisode?'🔔 Episode ':''}${x.trailer?'🎬 Trailer ':''}${x.news?'📰 News':''}</p><div class="subscription-actions"><button class="btn secondary" type="button" data-remove="${escapeHtml(x.id)}">Remove</button></div></div></article>`).join('');results.querySelectorAll('[data-remove]').forEach(b=>b.onclick=async()=>{b.disabled=true;await removeSub(b.dataset.remove);load()});return}
if(feature==='recommendations'){status.textContent='Choose an anime from Search, then open its Details page for title-specific recommendations.';results.innerHTML='<article class="anime-card"><div class="anime-card-copy"><h3>✨ Recommendation engine ready</h3><p>Search an anime → Details → Recommendations.</p><a class="btn primary" href="anime-search.html">Search Anime</a></div></article>';return}
const data=(feature==='countdown'||feature==='schedule')?await fetchCountdown():feature==='trending'?await fetchJikan('/top/anime?limit=12'):feature==='top'?await fetchJikan('/top/anime?limit=12&filter=bypopularity'):await fetchJikan('/anime?status=airing&order_by=popularity&sort=desc&limit=12');if(feature==='countdown'||feature==='schedule'){const useful=data.filter(a=>a.nextEpisodeAt&&a.nextEpisodeAt>Date.now());status.textContent=useful.length?`${useful.length} scheduled titles`:'No verified next-episode times available right now.';results.innerHTML=useful.map(a=>animeCard(a,`<div class="countdown">⏳ ${escapeHtml(countdownText(a.nextEpisodeAt))}${a.nextEpisode?' · Episode '+escapeHtml(a.nextEpisode):''}</div><button class="btn secondary save-btn" type="button" data-id="${escapeHtml(getAnimeId(a))}">🔔 Subscribe</button>`)).join('');await bind(useful);return}
const current=await subs(),languages=['Japanese','English','Hindi','Bengali','Other'];status.textContent=data.length?`${data.length} titles`:'No anime found.';results.innerHTML=data.map(a=>{const id=getAnimeId(a),saved=current.some(x=>String(x.id)===String(id));const extra=feature==='language'?`<p class="muted">This records your preferred language; it does not guarantee a dub release date.</p><div class="lang-row">${languages.map(l=>`<button class="lang-btn" type="button" data-id="${escapeHtml(id)}" data-lang="${escapeHtml(l)}">${saved&&current.find(x=>String(x.id)===String(id))?.language===l?'✓ ':''}${escapeHtml(l)}</button>`).join('')}</div>`:`<button class="btn secondary save-btn" data-id="${escapeHtml(id)}" type="button" aria-pressed="${saved}">${saved?'✓ Subscribed':'🔔 Subscribe'}</button>`;return animeCard(a,extra)}).join('');await bind(data)}catch(e){console.error(e);status.textContent='Could not load this feature right now. Please retry.'}}
load();setInterval(()=>{if(feature==='countdown'||feature==='schedule')load()},60000);</script></body></html>
