<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="Anime releases, countdowns, preferences and subscriptions in MG Master Hub."><title>Anime Feature — MG Master Hub</title><link rel="stylesheet" href="style.css?v=11"></head><body><header class="site-header app-shell"><a class="brand" href="index.html">⚡ MG Master Hub</a><div class="profile-area" id="profileArea"><a class="profile-btn" href="login.html" id="profileButton" aria-label="Open profile"><span class="avatar-fallback" id="avatarFallback">👤</span><img id="profileAvatar" class="profile-avatar" alt="Profile photo" hidden><span class="profile-name" id="profileName">Login</span></a><div class="profile-menu" id="profileMenu" hidden><div class="profile-menu-user"><img id="menuAvatar" class="menu-avatar" alt="Profile photo" hidden><div><strong id="menuName">Guest</strong><small id="menuEmail">Not signed in</small></div></div><a href="login.html">Account</a><button id="menuLogout" type="button" hidden>Log out</button></div></div></header><main class="app-shell"><section class="hero compact"><div class="badge" id="badge">🎌 ANIME</div><h1 id="title">Anime<br><span>feature.</span></h1><p id="intro">Loading…</p><div class="actions"><a class="btn secondary" href="anime.html">← Anime Hub</a><a class="btn secondary" href="anime-search.html">🔎 Search</a></div></section><section class="modules"><div id="status" aria-live="polite">Loading…</div><div id="results" class="anime-grid"></div></section></main><script type="module">import{fetchJikan,fetchCountdown,animeCard,getAnimeId,escapeHtml,getCurrentUser,saveSubscription,deleteSubscription,loadSubscriptions}from'./app.js?v=11';
const feature=new URLSearchParams(location.search).get('feature')||'new',title=document.getElementById('title'),intro=document.getElementById('intro'),badge=document.getElementById('badge'),status=document.getElementById('status'),results=document.getElementById('results');
const configs={new:['🆕 NEW RELEASES','New releases.','Browse currently airing anime.'],trending:['🔥 TRENDING','Trending anime.','Popular titles from the anime catalog.'],countdown:['⏳ COUNTDOWN','Release<br><span>countdown.</span>','Real next-episode countdowns from AniList airing data.'],language:['🌐 LANGUAGE','Language<br><span>preferences.</span>','Choose a preferred language for your subscription; this does not claim a dub release.'],subscribed:['🔔 SUBSCRIBED','Your<br><span>anime.</span>','Manage subscriptions and notification preferences.']};
const c=configs[feature]||configs.new;badge.textContent=c[0];title.innerHTML=c[1];intro.textContent=c[2];
const localKey='mgAnimeSubscriptions';
const localSaved=()=>{try{const v=JSON.parse(localStorage.getItem(localKey)||'[]');return Array.isArray(v)?v:[]}catch{return[]}};
const localSave=x=>localStorage.setItem(localKey,JSON.stringify(x));
async function subs(){try{const u=await getCurrentUser();if(u)return await loadSubscriptions()}catch(e){console.warn('Cloud subscriptions unavailable:',e)}return localSaved()}
async function subscribe(a,lang='Japanese'){if(!a)return;const id=getAnimeId(a),item={id,title:a.englishTitle||a.title||'Unknown',language:lang,reminder:'1 hour',newEpisode:true,news:false,trailer:false,added:Date.now(),source:a.provider||'unknown'};try{const u=await getCurrentUser();if(u){await saveSubscription(item);return}}catch(e){console.warn('Cloud subscription failed:',e)}const list=localSaved(),old=list.find(x=>String(x.id)===String(id));if(old)Object.assign(old,item);else list.push(item);localSave(list)}
async function removeSub(id){try{const u=await getCurrentUser();if(u){await deleteSubscription(id);return}}catch(e){console.warn('Cloud delete failed:',e)}localSave(localSaved().filter(x=>String(x.id)!==String(id)))}
async function editSub(id){const list=await subs(),item=list.find(x=>String(x.id)===String(id));if(!item)return;const panel=document.createElement('div');panel.className='subscription-editor';panel.innerHTML=`<div class="subscription-editor-inner" role="dialog" aria-modal="true" aria-label="Edit subscription"><h3>✏️ Edit subscription</h3><p>${escapeHtml(item.title)}</p><label>Language<select id="editLang"><option>Japanese</option><option>English</option><option>Hindi</option><option>Bengali</option><option>Other</option></select></label><label>Custom language<input id="customLang" maxlength="40" placeholder="e.g. Tamil" hidden></label><label>Release reminder<select id="editReminder"><option>Off</option><option>15 minutes</option><option>1 hour</option><option>1 day</option></select></label><label class="check"><input id="editEpisode" type="checkbox"> New episode</label><label class="check"><input id="editTrailer" type="checkbox"> Trailer updates</label><label class="check"><input id="editNews" type="checkbox"> News updates</label><div class="editor-actions"><button class="btn primary" id="saveEdit" type="button">Save</button><button class="btn secondary" id="cancelEdit" type="button">Cancel</button></div></div>`;document.body.appendChild(panel);const lang=panel.querySelector('#editLang'),custom=panel.querySelector('#customLang');lang.value=['Japanese','English','Hindi','Bengali','Other'].includes(item.language)?item.language:'Other';custom.value=['Japanese','English','Hindi','Bengali','Other'].includes(item.language)?'':item.language||'';custom.hidden=lang.value!=='Other';lang.onchange=()=>custom.hidden=lang.value!=='Other';panel.querySelector('#editReminder').value=item.reminder||'1 hour';panel.querySelector('#editEpisode').checked=item.newEpisode!==false;panel.querySelector('#editTrailer').checked=!!item.trailer;panel.querySelector('#editNews').checked=!!item.news;panel.querySelector('#cancelEdit').onclick=()=>panel.remove();panel.querySelector('#saveEdit').onclick=async()=>{item.language=lang.value==='Other'?(custom.value.trim()||'Other'):lang.value;item.reminder=panel.querySelector('#editReminder').value;item.newEpisode=panel.querySelector('#editEpisode').checked;item.trailer=panel.querySelector('#editTrailer').checked;item.news=panel.querySelector('#editNews').checked;try{const u=await getCurrentUser();if(u)await saveSubscription(item);else throw new Error('guest')}catch(e){const ls=localSaved(),i=ls.findIndex(x=>String(x.id)===String(id));if(i>=0)ls[i]=item;else ls.push(item);localSave(ls)}panel.remove();load()}}
function countdownText(ts){if(!ts)return 'Airing time unavailable';const diff=Math.max(0,ts-Date.now()),s=Math.floor(diff/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),sec=s%60;return `${String(d).padStart(2,'0')}d ${String(h).padStart(2,'0')}h ${String(m).padStart(2,'0')}m ${String(sec).padStart(2,'0')}s`}
async function bindButtons(data){const current=await subs();results.querySelectorAll('.save-btn').forEach(b=>{const id=b.dataset.id,active=current.some(x=>String(x.id)===String(id));b.textContent=active?'✓ Subscribed':'🔔 Subscribe';b.onclick=async()=>{const a=data.find(x=>String(getAnimeId(x))===String(id));b.disabled=true;await subscribe(a);b.disabled=false;b.textContent='✓ Subscribed';b.setAttribute('aria-pressed','true')}});results.querySelectorAll('.lang-btn').forEach(b=>b.onclick=async()=>{const a=data.find(x=>String(getAnimeId(x))===String(b.dataset.id));await subscribe(a,b.dataset.lang);b.textContent='✓ '+b.dataset.lang})}
async function renderCountdown(data){const useful=data.filter(a=>a.nextEpisodeAt);status.textContent=useful.length?`${useful.length} scheduled titles`:'No verified next-episode times available right now.';results.innerHTML=useful.map(a=>{const id=getAnimeId(a);return animeCard(a,`<div class="countdown" data-countdown="${escapeHtml(id)}" data-time="${escapeHtml(a.nextEpisodeAt)}">⏳ ${escapeHtml(countdownText(a.nextEpisodeAt))}${a.nextEpisode?' · Episode '+escapeHtml(a.nextEpisode):''}</div><button class="btn secondary save-btn" type="button" data-id="${escapeHtml(id)}">Loading…</button>`)}).join('');await bindButtons(useful)}
function updateCountdowns(){let expired=false;results.querySelectorAll('[data-countdown]').forEach(el=>{const ts=Number(el.dataset.time);if(ts){el.textContent='⏳ '+countdownText(ts);if(ts<=Date.now())expired=true}});if(expired)load()}
async function load(){results.innerHTML='';status.textContent='Loading…';try{if(feature==='subscribed'){const list=await subs();status.textContent=list.length?`${list.length} subscribed anime`:'No subscriptions yet. Search an anime and subscribe to it.';results.innerHTML=list.map(x=>`<article class="anime-card"><div class="anime-card-copy"><h3>${escapeHtml(x.title)}</h3><p>Language: ${escapeHtml(x.language||'Japanese')} · Reminder: ${escapeHtml(x.reminder||'Off')}</p><p>${x.newEpisode?'🔔 Episode ':''}${x.trailer?'🎬 Trailer ':''}${x.news?'📰 News':''}</p><div class="subscription-actions"><button class="btn secondary" type="button" data-edit="${escapeHtml(x.id)}">✏️ Edit</button><button class="btn secondary" type="button" data-remove="${escapeHtml(x.id)}">Remove</button></div></div></article>`).join('');results.querySelectorAll('[data-remove]').forEach(b=>b.onclick=async()=>{b.disabled=true;await removeSub(b.dataset.remove);load()});results.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editSub(b.dataset.edit));return}
const data=feature==='countdown'?await fetchCountdown():(feature==='trending'?await fetchJikan('/top/anime?limit=12'):await fetchJikan('/anime?status=airing&order_by=popularity&sort=asc&limit=12'));
if(feature==='countdown'){await renderCountdown(data);return}
status.textContent=data.length?`${data.length} titles`:'No anime found.';const languages=['Japanese','English','Hindi','Bengali','Other'],current=await subs();results.innerHTML=data.map(a=>{const id=getAnimeId(a),savedNow=current.some(x=>String(x.id)===String(id));const extra=feature==='language'?`<p class="muted">These providers do not supply reliable Hindi/Bengali dub release schedules here. This setting only records your preference.</p><div class="lang-row">${languages.map(l=>`<button class="lang-btn" type="button" data-id="${escapeHtml(id)}" data-lang="${escapeHtml(l)}">${savedNow&&current.find(x=>String(x.id)===String(id))?.language===l?'✓ ':''}${escapeHtml(l)}</button>`).join('')}</div>`:`<button class="btn secondary save-btn" data-id="${escapeHtml(id)}" type="button">${savedNow?'✓ Subscribed':'🔔 Subscribe'}</button>`;return animeCard(a,extra)}).join('');await bindButtons(data)}catch(e){console.error(e);status.textContent='Anime data is temporarily unavailable. Please try again shortly.'}}
load();setInterval(updateCountdowns,1000);setInterval(()=>{if(feature==='countdown')load()},60000);</script></body></html>
