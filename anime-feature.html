<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Anime discovery, schedules, countdowns, recommendations and subscriptions."><title>Anime Feature — MG Master Hub</title><link rel="stylesheet" href="style.css?v=19"><style>.feature-tools{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.feature-tools select,.pref-row select{min-width:150px;padding:10px;border-radius:10px;border:1px solid #29344b;background:#111827;color:inherit}.pref-panel{margin-top:12px;padding:12px;border:1px solid #29344b;border-radius:12px}.pref-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0}.pref-row label{font-size:.9rem}.check-row{display:flex;flex-wrap:wrap;gap:12px}.muted{opacity:.72;font-size:.9rem}.language-help{margin-top:10px}.subscribe-note{margin-top:8px}.feature-loading{min-height:90px;display:grid;place-items:center;border:1px solid #20283a;border-radius:16px;background:#0d1220;color:#98a4bb}.lang-status{min-height:20px}</style></head><body><header class="site-header app-shell"><a class="brand" href="index.html">⚡ MG Master Hub</a><div class="profile-area" id="profileArea"><a class="profile-btn" href="login.html" id="profileButton" aria-label="Open profile"><span class="avatar-fallback" id="avatarFallback">👤</span><img id="profileAvatar" class="profile-avatar" alt="Profile photo" hidden><span class="profile-name" id="profileName">Login</span></a><div class="profile-menu" id="profileMenu" hidden><div class="profile-menu-user"><img id="menuAvatar" class="menu-avatar" alt="Profile photo" hidden><div><strong id="menuName">Guest</strong><small id="menuEmail">Not signed in</small></div></div><a href="login.html">Account</a><button id="menuLogout" type="button" hidden>Log out</button></div></div></header><main class="app-shell"><section class="hero compact"><div class="badge" id="badge">🎌 ANIME</div><h1 id="title">Anime<br><span>feature.</span></h1><p id="intro">Loading…</p><div class="actions"><a class="btn secondary" href="anime.html">← Anime Hub</a><a class="btn secondary" href="anime-search.html">🔎 Search</a></div></section><section class="modules"><div id="languagePanel" class="pref-panel" hidden><div class="pref-row"><label for="globalLanguage">Preferred language</label><select id="globalLanguage"></select><button class="btn primary" id="saveGlobalLanguage" type="button">Save preference</button></div><p class="muted language-help">This language is used as the default for new subscriptions and recommendation filtering.</p><div id="globalLanguageStatus" class="muted lang-status" aria-live="polite"></div></div><div id="status" aria-live="polite">Loading…</div><div id="results" class="anime-grid"></div></section></main><script type="module">import{fetchJikan,fetchCountdown,fetchAnimeRecommendations,animeCard,getAnimeId,escapeHtml,getCurrentUser,saveSubscription,deleteSubscription,loadSubscriptions,getPreferredLanguage,savePreferredLanguage}from'./anime-api.js?v=2';const params=new URLSearchParams(location.search),feature=params.get('feature')||'new',selectedId=params.get('id');const title=document.getElementById('title'),intro=document.getElementById('intro'),badge=document.getElementById('badge'),status=document.getElementById('status'),results=document.getElementById('results'),languagePanel=document.getElementById('languagePanel'),globalLanguage=document.getElementById('globalLanguage'),saveGlobalLanguage=document.getElementById('saveGlobalLanguage'),globalLanguageStatus=document.getElementById('globalLanguageStatus');const configs={new:['🆕 NEW RELEASES','New releases.','Currently airing anime from live catalog data.'],schedule:['📅 SCHEDULE','Anime<br><span>schedule.</span>','Verified upcoming episode times.'],trending:['🔥 TRENDING','Trending anime.','Currently trending titles.'],top:['🏆 TOP ANIME','Top<br><span>anime.</span>','Top-rated/popular titles from the catalog.'],recommendations:['✨ RECOMMENDATIONS','More anime<br><span>to explore.</span>','Recommendations based on a selected anime.'],countdown:['⏳ COUNTDOWN','Release<br><span>countdown.</span>','Verified next-episode countdowns.'],language:['🌐 LANGUAGE','Language<br><span>preferences.</span>','Choose the default anime language used across subscriptions and recommendations.'],subscribed:['🔔 MY ANIME','Your<br><span>anime.</span>','Edit language and notification preferences.']};const c=configs[feature]||configs.new;badge.textContent=c[0];title.innerHTML=c[1];intro.textContent=c[2];const localKey='mgAnimeSubscriptions';const localSaved=()=>{try{const v=JSON.parse(localStorage.getItem(localKey)||'[]');return Array.isArray(v)?v:[]}catch{return[]}};const localSave=x=>localStorage.setItem(localKey,JSON.stringify(x));async function getSubs(){try{const u=await getCurrentUser();if(u)return await loadSubscriptions()}catch{}return localSaved()}async function saveItem(item){try{return await saveSubscription(item)}catch{}const list=localSaved(),i=list.findIndex(x=>String(x.id)===String(item.id));if(i>=0)list[i]=item;else list.push(item);localSave(list);return false}async function removeItem(id){try{await deleteSubscription(id);return true}catch{}localSave(localSaved().filter(x=>String(x.id)!==String(id)));return false}function languageOptions(selected){const common=['Japanese','English','Hindi','Bengali','Korean','Chinese','Tamil','Telugu','Malayalam','Spanish','French','German','Portuguese','Italian','Indonesian','Thai','Other'];let extra=[];try{const codes=typeof Intl.supportedValuesOf==='function'?Intl.supportedValuesOf('language'):[];const names=new Intl.DisplayNames([navigator.language||'en'],{type:'language'});extra=codes.map(x=>({code:x,name:names.of(x)||x})).filter(x=>x.name).slice(0,160)}catch{}const seen=new Set(),all=[];[...common.map(x=>({code:x,name:x})),...extra].forEach(x=>{const k=x.name.toLowerCase();if(!seen.has(k)){seen.add(k);all.push(x)}});return all.map(x=>`<option value="${escapeHtml(x.name)}" ${x.name===selected?'selected':''}>${escapeHtml(x.name)}</option>`).join('')}function populateGlobalLanguage(selected){globalLanguage.innerHTML=languageOptions(selected)}async function initLanguagePreference(){if(feature!=='language')return;languagePanel.hidden=false;try{const current=await getPreferredLanguage();populateGlobalLanguage(current||'Hindi')}catch{populateGlobalLanguage('Hindi')}saveGlobalLanguage.onclick=async()=>{saveGlobalLanguage.disabled=true;try{const cloud=await savePreferredLanguage(globalLanguage.value);globalLanguageStatus.textContent=cloud?'✓ Preference synced to your account.':'✓ Preference saved on this device. Sign in to sync across devices.'}catch(e){globalLanguageStatus.textContent='Could not save preference right now.'}finally{saveGlobalLanguage.disabled=false}}}function countdownText(ts){const diff=Math.max(0,ts-Date.now()),s=Math.floor(diff/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),sec=s%60;return`${d}d ${String(h).padStart(2,'0')}h ${String(m).padStart(2,'0')}m ${String(sec).padStart(2,'0')}s`}async function renderSubscribed(){const list=await getSubs();status.textContent=list.length?`${list.length} subscribed anime`:'No subscriptions yet. Search an anime and subscribe.';results.innerHTML=list.map(x=>`<article class="anime-card"><div class="anime-card-copy"><h3>${escapeHtml(x.title)}</h3><div class="pref-panel"><div class="pref-row"><label>Language <select data-field="language" data-id="${escapeHtml(x.id)}">${languageOptions(x.language||'Japanese')}</select></label><label>Reminder <select data-field="reminder" data-id="${escapeHtml(x.id)}"><option ${x.reminder==='Off'?'selected':''}>Off</option><option ${x.reminder==='1 hour'?'selected':''}>1 hour</option><option ${x.reminder==='1 day'?'selected':''}>1 day</option><option ${x.reminder==='1 week'?'selected':''}>1 week</option></select></label></div><div class="check-row"><label><input type="checkbox" data-field="newEpisode" data-id="${escapeHtml(x.id)}" ${x.newEpisode!==false?'checked':''}> New episode</label><label><input type="checkbox" data-field="trailer" data-id="${escapeHtml(x.id)}" ${x.trailer?'checked':''}> Trailer</label><label><input type="checkbox" data-field="news" data-id="${escapeHtml(x.id)}" ${x.news?'checked':''}> News</label></div><div class="feature-tools"><a class="btn secondary" href="anime-detail.html?id=${encodeURIComponent(String(x.malId||'').replace(/anime:mal:/,''))}">Details</a><button class="btn primary save-pref" data-id="${escapeHtml(x.id)}">Save changes</button><button class="btn secondary remove-sub" data-id="${escapeHtml(x.id)}">Unsubscribe</button></div><p class="muted">Preferences sync to your account when signed in; otherwise they stay on this device.</p></div></div></article>`).join('');results.querySelectorAll('.save-pref').forEach(b=>b.onclick=async()=>{const x=list.find(v=>String(v.id)===String(b.dataset.id));if(!x)return;const get=(field)=>results.querySelector(`[data-field="${field}"][data-id="${CSS.escape(b.dataset.id)}"]`);const lang=get('language'),rem=get('reminder'),ne=get('newEpisode'),tr=get('trailer'),nw=get('news');const updated={...x,language:lang.value,reminder:rem.value,newEpisode:ne.checked,trailer:tr.checked,news:nw.checked};b.disabled=true;const cloud=await saveItem(updated);b.disabled=false;b.textContent='✓ Saved';setTimeout(()=>b.textContent='Save changes',1200);status.textContent=cloud?'Preferences synced to your account.':'Saved locally. Sign in to sync across devices.'});results.querySelectorAll('.remove-sub').forEach(b=>b.onclick=async()=>{b.disabled=true;await removeItem(b.dataset.id);await renderSubscribed()})}async function renderRecommendations(){if(!selectedId){status.textContent='Open Details from an anime to get recommendations.';results.innerHTML='<article class="anime-card"><div class="anime-card-copy"><h3>✨ Choose an anime first</h3><p>Search for an anime and open its Details page.</p><a class="btn primary" href="anime-search.html">Search Anime</a></div></article>';return}const data=await fetchAnimeRecommendations(selectedId);status.textContent=data.length?`${data.length} recommendations`:'No recommendations available.';results.innerHTML=data.map(a=>animeCard(a)).join('')}async function renderList(){let data=[];if(feature==='countdown'||feature==='schedule')data=await fetchCountdown();else if(feature==='trending')data=await fetchJikan('/top/anime?limit=12');else if(feature==='top')data=await fetchJikan('/top/anime?limit=12');else if(feature==='language'){status.textContent='Language preference ready.';results.innerHTML='<article class="anime-card"><div class="anime-card-copy"><h3>🌐 Recommendation & subscription language</h3><p>Your saved language becomes the default for new subscriptions and can be used to personalize future recommendations.</p></div></article>';return}else data=await fetchJikan('/anime?status=airing&order_by=popularity&sort=desc&limit=12');data=data.filter(a=>feature==='countdown'||feature==='schedule'?a.nextEpisodeAt&&a.nextEpisodeAt>Date.now():true);status.textContent=data.length?`${data.length} titles`:'No results available right now.';const subs=await getSubs();const preferred=await getPreferredLanguage();results.innerHTML=data.map(a=>{const id=getAnimeId(a),saved=subs.some(x=>String(x.id)===String(id));const extra=feature==='countdown'||feature==='schedule'?`<div class="countdown">⏳ ${escapeHtml(countdownText(a.nextEpisodeAt))}${a.nextEpisode?' · Episode '+escapeHtml(a.nextEpisode):''}</div><button class="btn secondary save-btn" data-id="${escapeHtml(id)}">${saved?'✓ Subscribed':'🔔 Subscribe'}</button>`:`<button class="btn secondary save-btn" data-id="${escapeHtml(id)}">${saved?'✓ Subscribed':'🔔 Subscribe'}</button>`;return animeCard(a,extra)}).join('');results.querySelectorAll('.save-btn').forEach(b=>b.onclick=async()=>{const a=data.find(x=>String(getAnimeId(x))===String(b.dataset.id));if(!a)return;const old=subs.find(x=>String(x.id)===String(b.dataset.id));const item={id:getAnimeId(a),malId:a.malId||null,title:a.englishTitle||a.title||'Unknown',language:old?.language||preferred||'Hindi',reminder:old?.reminder||'1 hour',newEpisode:old?.newEpisode!==false,news:old?.news||false,trailer:old?.trailer||false,added:old?.added||Date.now(),source:a.provider||'unknown'};b.disabled=true;const cloud=await saveItem(item);b.disabled=false;b.textContent='✓ Subscribed';b.setAttribute('aria-pressed','true');status.textContent=cloud?'Subscription synced to your account.':`Saved locally with ${item.language} preference. Sign in to sync across devices.`})}async function load(){results.innerHTML='';status.textContent='Loading…';try{await initLanguagePreference();if(feature==='subscribed')return renderSubscribed();if(feature==='recommendations')return renderRecommendations();await renderList()}catch(e){console.error(e);status.textContent='Could not load this feature right now. Please retry.';results.innerHTML='<article class="anime-card"><div class="anime-card-copy"><h3>Something went wrong</h3><p>Anime providers may be temporarily busy. Try again in a moment.</p><button class="btn primary" onclick="location.reload()">Retry</button></div></article>'}}load();if(feature==='countdown'||feature==='schedule')setInterval(load,60000);</script><script type="module" src="auth-ui.js?v=4"></script></body></html>
