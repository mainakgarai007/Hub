<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Sign in or create an MG Master Hub account."><title>Account — MG Master Hub</title>
<link rel="stylesheet" href="style.css?v=18">
<style>.password-row{display:flex;gap:8px}.password-row input{flex:1;min-width:0}.password-toggle{flex:0 0 64px;border:1px solid #29344b;border-radius:10px;background:#111827;color:#9eabff;font-weight:700;cursor:pointer}.forgot-btn{display:block;margin:10px auto 0;border:0;background:transparent;color:#9eabff;font-size:.82rem;font-weight:700;cursor:pointer}.password-toggle:hover,.forgot-btn:hover{color:#fff}.auth-message{min-height:24px}</style>
</head>
<body><main class="app-shell"><section class="hero auth-hero"><div class="auth-wrap"><div class="badge">ACCOUNT</div><h1>Welcome to <span>MG Master Hub</span></h1><p>Sign in to continue, or create an account to sync your preferences.</p>
<div class="auth-card" id="authCard"><div class="auth-tabs" role="tablist" aria-label="Account access"><button class="auth-tab active" id="loginTab" type="button" role="tab" aria-selected="true">Login</button><button class="auth-tab" id="signupTab" type="button" role="tab" aria-selected="false">Sign up</button></div>
<form id="authForm" novalidate><div class="auth-field signup-only" id="nameField" hidden><label for="displayName">Name</label><input id="displayName" type="text" maxlength="60" autocomplete="name" placeholder="Your name"></div><div class="auth-field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></div><div class="auth-field"><label for="password">Password</label><div class="password-row"><input id="password" type="password" minlength="6" autocomplete="current-password" required placeholder="At least 6 characters"><button class="password-toggle" id="passwordToggle" type="button">Show</button></div></div><div class="auth-field signup-only" id="confirmField" hidden><label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" minlength="6" autocomplete="new-password" placeholder="Repeat your password"></div><button class="auth-submit" id="authSubmit" type="submit">Login</button></form><button class="forgot-btn" id="forgotBtn" type="button">Forgot password?</button><div class="divider"><span>or</span></div><button class="google-btn" id="googleBtn" type="button">Continue with Google</button><div class="auth-message" id="authMessage" role="status" aria-live="polite"></div></div>
<div class="auth-card account-panel" id="accountPanel" hidden><div class="profile-large"><img id="accountAvatar" alt="Profile photo" hidden><span id="accountFallback" aria-hidden="true">👤</span></div><h2 id="accountName">Welcome!</h2><p id="accountEmail"></p><button class="logout-btn" id="logoutBtn" type="button">Log out</button></div><div class="actions home-actions"><a class="btn secondary" href="index.html">← Back to Hub</a><a class="btn secondary" href="anime.html">Open Anime</a></div></div></section></main>
<script type="module">
const V='12.18.0',CONFIG={apiKey:'AIzaSyBF3jubXpba2G8CPszVN-Dip-3OWs_EUoE',authDomain:'hubs-b9c39.firebaseapp.com',projectId:'hubs-b9c39',storageBucket:'hubs-b9c39.firebasestorage.app',messagingSenderId:'699995857695',appId:'1:699995857695:web:240f8598fb4100d7cf462a'};
const $=id=>document.getElementById(id);const loginTab=$('loginTab'),signupTab=$('signupTab'),form=$('authForm'),submit=$('authSubmit'),google=$('googleBtn'),forgot=$('forgotBtn'),msg=$('authMessage'),card=$('authCard'),panel=$('accountPanel'),emailEl=$('accountEmail'),nameEl=$('accountName'),avatar=$('accountAvatar'),fallback=$('accountFallback'),logout=$('logoutBtn'),nameInput=$('displayName'),confirm=$('confirmPassword'),password=$('password'),toggle=$('passwordToggle'),nameField=$('nameField'),confirmField=$('confirmField');
let mode='login',auth,modules,ready;
function message(text,cls=''){msg.textContent=text;msg.className=`auth-message ${cls}`}
function setMode(next){mode=next;loginTab.classList.toggle('active',mode==='login');signupTab.classList.toggle('active',mode==='signup');loginTab.setAttribute('aria-selected',String(mode==='login'));signupTab.setAttribute('aria-selected',String(mode==='signup'));submit.textContent=mode==='login'?'Login':'Create account';nameField.hidden=mode!=='signup';confirmField.hidden=mode!=='signup';forgot.hidden=mode!=='login';form.reset();message('');password.type='password';toggle.textContent='Show'}
loginTab.onclick=()=>setMode('login');signupTab.onclick=()=>setMode('signup');toggle.onclick=()=>{password.type=password.type==='password'?'text':'password';toggle.textContent=password.type==='password'?'Show':'Hide'};
function friendly(e){const c=e?.code||'';return({'auth/email-already-in-use':'This email already has an account. Switch to Login.','auth/invalid-email':'Please enter a valid email address.','auth/weak-password':'Password must be at least 6 characters.','auth/invalid-credential':'Email or password is incorrect.','auth/user-disabled':'This account has been disabled.','auth/unauthorized-domain':'This website is not authorized for sign-in yet.','auth/popup-blocked':'Google popup was blocked. Allow popups for this site and try again.','auth/popup-closed-by-user':'Google sign-in was cancelled.','auth/cancelled-popup-request':'Another Google sign-in is already running.','auth/operation-not-allowed':'This sign-in method is disabled in Firebase Authentication.','auth/account-exists-with-different-credential':'This Google email already uses another sign-in method.','auth/network-request-failed':'Network error. Check your connection.','auth/invalid-api-key':'Firebase API key is invalid or restricted incorrectly.','auth/too-many-requests':'Too many attempts. Please wait a little and try again.','auth/user-not-found':'No account was found for this email.'}[c]||e?.message||'Authentication failed. Please try again.')}
function showUser(user){if(!user){card.hidden=false;panel.hidden=true;return}card.hidden=true;panel.hidden=false;nameEl.textContent=user.displayName||user.email?.split('@')[0]||'Welcome!';emailEl.textContent=user.email||'';if(user.photoURL){avatar.src=user.photoURL;avatar.hidden=false;fallback.hidden=true}else{avatar.hidden=true;fallback.hidden=false}}
async function boot(){try{const appM=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);modules=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);const app=appM.getApps().length?appM.getApps()[0]:appM.initializeApp(CONFIG);auth=modules.getAuth(app);ready=modules.setPersistence(auth,modules.browserLocalPersistence);await ready;modules.onAuthStateChanged(auth,showUser);showUser(auth.currentUser);
form.addEventListener('submit',async e=>{e.preventDefault();await ready;const email=$('email').value.trim(),pass=password.value;if(!email||!pass)return message('Enter your email and password.','error');if(pass.length<6)return message('Password must be at least 6 characters.','error');if(mode==='signup'&&pass!==confirm.value)return message('Passwords do not match.','error');submit.disabled=true;google.disabled=true;message(mode==='login'?'Signing in…':'Creating your account…');try{if(mode==='signup'){const r=await modules.createUserWithEmailAndPassword(auth,email,pass);if(nameInput.value.trim())await modules.updateProfile(r.user,{displayName:nameInput.value.trim()});message('Account created successfully!','success')}else{await modules.signInWithEmailAndPassword(auth,email,pass);message('Login successful!','success')}}catch(e){console.error(e);message(friendly(e),'error')}finally{submit.disabled=false;google.disabled=false}});
forgot.onclick=async()=>{await ready;const email=$('email').value.trim();if(!email)return message('Enter your email first.','error');forgot.disabled=true;try{await modules.sendPasswordResetEmail(auth,email);message('Password reset email sent. Check your inbox.','success')}catch(e){message(friendly(e),'error')}finally{forgot.disabled=false}};
google.onclick=async()=>{await ready;google.disabled=true;submit.disabled=true;message('Opening Google sign-in…');try{const provider=new modules.GoogleAuthProvider();provider.setCustomParameters({prompt:'select_account'});await modules.signInWithPopup(auth,provider);message('Google login successful!','success')}catch(e){console.error(e);if(e?.code==='auth/popup-blocked'){message('Popup blocked. Please allow popups and try again.','error')}else if(e?.code==='auth/popup-closed-by-user'){message('Google sign-in was cancelled.','error')}else message(friendly(e),'error')}finally{google.disabled=false;submit.disabled=false}};
logout.onclick=async()=>{logout.disabled=true;try{await modules.signOut(auth);message('Logged out.','success')}catch(e){message('Could not log out. Please try again.','error')}finally{logout.disabled=false}};
}catch(e){console.error(e);message('Firebase could not load. Check your connection and refresh the page.','error')}}boot();
</script></body></html>
