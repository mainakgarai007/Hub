<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Anime Search — MG Master Hub</title><link rel="stylesheet" href="style.css?v=10"></head><body><header class="site-header app-shell"><a class="brand" href="index.html">⚡ MG Master Hub</a><div class="profile-area" id="profileArea"><a class="profile-btn" href="login.html" id="profileButton"><span class="avatar-fallback" id="avatarFallback">👤</span><img id="profileAvatar" class="profile-avatar" alt="Profile photo" hidden><span class="profile-name" id="profileName">Login</span></a><div class="profile-menu" id="profileMenu" hidden><div class="profile-menu-user"><img id="menuAvatar" class="menu-avatar" alt="Profile photo" hidden><div><strong id="menuName">Guest</strong><small id="menuEmail">Not signed in</small></div></div><a href="login.html">Account</a><button id="menuLogout" type="button" hidden>Log out</button></div></div></header><main class="app-shell"><section class="hero compact"><div class="badge">🔎 ANIME SEARCH</div><h1>Find your<br><span>anime.</span></h1><p>Search Jikan first, then automatically use AniList and Kitsu if a provider is temporarily unavailable.</p><form id="searchForm" class="search-box"><input id="query" required maxlength="80" placeholder="Search anime..." autocomplete="off"><button class="btn primary" id="searchButton" type="submit">Search</button></form><div class="actions"><a class="btn secondary" href="anime.html">← Anime Hub</a></div></section><section class="modules"><div id="status" aria-live="polite"></div><div id="results" class="anime-grid"></div></section></main><script type="module">import{searchAnime,animeCard,getAnimeId,escapeHtml}from'./app.js?v=10';
const form=document.getElementById('searchForm'),query=document.getElementById('query'),results=document.getElementById('results'),status=document.getElementById('status'),button=document.getElementById('searchButton');
const saved=()=>{try{const v=JSON.parse(localStorage.getItem('mgAnimeSubscriptions')||'[]');return Array.isArray(v)?v:[]}catch{return[]}};
const save=x=>localStorage.setItem('mgAnimeSubscriptions',JSON.stringify(x));
const subscribe=a=>{if(!a)return;const list=saved(),id=getAnimeId(a);if(!list.some(x=>String(x.id)===String(id)))list.push({id,title:a.title_english||a.title||'Unknown',language:'Japanese',reminder:'1 hour',newEpisode:true,news:false,trailer:false,added:Date.now(),source:a._source||'unknown'});save(list)};
const run=async()=>{const q=query.value.trim();if(!q)return;button.disabled=true;button.textContent='Searching…';status.textContent='Searching…';results.innerHTML='';try{const data=await searchAnime(q);status.textContent=data.length?`${data.length} results found`:'No anime found.';results.innerHTML=data.map(a=>{const id=getAnimeId(a),active=saved().some(x=>String(x.id)===String(id));return animeCard(a,`<div class="card-actions"><button class="btn secondary save-btn" type="button" data-id="${escapeHtml(id)}">${active?'✓ Subscribed':'🔔 Subscribe'}</button><a class="btn secondary" href="anime-feature.html?feature=subscribed">Subscriptions</a></div>`)}).join('');results.querySelectorAll('.save-btn').forEach(b=>b.onclick=()=>{const a=data.find(x=>String(getAnimeId(x))===String(b.dataset.id));subscribe(a);b.textContent='✓ Subscribed'})}catch(err){console.error(err);status.textContent='All anime providers are temporarily unavailable. Please try again shortly.'}finally{button.disabled=false;button.textContent='Search'}};
form.addEventListener('submit',e=>{e.preventDefault();run()});</script></body></html>
