<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="description" content="MG Master Hub AI Helper — a secure AI assistant for learning, coding and everyday questions.">
  <title>AI Helper · MG Master Hub</title>
  <link rel="stylesheet" href="style.css?v=11">
  <style>
    .ai-shell{padding:34px 0 70px}.ai-panel{max-width:820px;margin:auto}.ai-head{margin-bottom:22px}.ai-head h1{margin:10px 0 6px;font-size:clamp(2.2rem,7vw,4.2rem);letter-spacing:-.05em}.ai-head p{margin:0;color:#98a4bb}.chat{display:flex;flex-direction:column;gap:12px;min-height:360px;max-height:58vh;overflow:auto;padding:4px 2px 16px}.bubble{max-width:min(88%,680px);padding:12px 14px;border:1px solid #20283a;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.user{align-self:flex-end;background:#151c2c}.bubble.assistant{align-self:flex-start;background:#0d1220}.bubble.system{align-self:center;max-width:100%;background:#0b101b;color:#8f9ab0;font-size:.85rem}.composer{position:sticky;bottom:12px;display:flex;gap:10px;padding:10px;margin-top:10px;border:1px solid #20283a;border-radius:16px;background:rgba(7,10,18,.94);backdrop-filter:blur(10px)}.composer textarea{flex:1;min-width:0;min-height:48px;max-height:150px;resize:vertical;padding:12px;border:1px solid #29344b;border-radius:11px;background:#080c15;color:#fff;outline:none}.composer textarea:focus{border-color:#8f9cff}.composer button{align-self:flex-end}.ai-note{margin:10px 2px 0;color:#68748b;font-size:.75rem}.back-link{display:inline-flex;margin-bottom:12px;color:#aeb7ca}.back-link:hover{color:#fff}.typing{display:inline-flex;gap:4px;align-items:center}.typing i{width:5px;height:5px;border-radius:50%;background:#8f9cff;animation:blink 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes blink{50%{opacity:.25}}
  </style>
</head>
<body>
  <header class="site-header app-shell">
    <a class="brand" href="index.html">⚡ MG Master Hub</a>
    <a class="profile-btn" href="login.html" aria-label="Open account">👤 Account</a>
  </header>
  <main class="app-shell ai-shell">
    <section class="ai-panel">
      <a class="back-link" href="index.html">← Back to Hub</a>
      <div class="ai-head">
        <span class="badge">🤖 AI HELPER</span>
        <h1>Ask anything.<br><span style="color:#8f9cff">Build anything.</span></h1>
        <p>Get help with school topics, coding, projects, explanations and ideas.</p>
      </div>
      <div id="chat" class="chat" aria-live="polite"></div>
      <form id="composer" class="composer">
        <label class="sr-only" for="message">Message</label>
        <textarea id="message" maxlength="4000" rows="2" placeholder="Ask MG AI Helper…" required></textarea>
        <button class="btn primary" id="sendBtn" type="submit">Send</button>
      </form>
      <p class="ai-note">AI can make mistakes. Check important answers with your teacher or a trusted source.</p>
    </section>
  </main>
  <script type="module" src="ai.js?v=1"></script>
</body>
</html>
