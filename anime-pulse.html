<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Anime Pulse — follow anime and see important updates in one place."><title>Anime Pulse — MG Master Hub</title><link rel="stylesheet" href="style.css?v=28"><style>.pulse-filter{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.pulse-filter button.active{outline:2px solid #7c8cff}.pulse-item{margin-bottom:14px}.pulse-meta{opacity:.72;font-size:.9rem}.pulse-empty{padding:22px}.pulse-update{border-left:3px solid #7c8cff;padding-left:12px;margin-top:12px}.pulse-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.pulse-news{border-left-color:#f4c95d}.pulse-news a{word-break:break-word}.pulse-progress{margin:10px 0;padding:10px 12px;border:1px solid #29344b;border-radius:12px;background:#0d1220;opacity:.9}.pulse-error{border-left:3px solid #e58a8a;padding-left:12px}.pulse-muted{opacity:.72}</style></head><body><header class="site-header app-shell"><a class="brand" href="index.html">⚡ MG Master Hub</a><div class="profile-area" id="profileArea"><a class="profile-btn" href="login.html" id="profileButton" aria-label="Open profile"><span class="avatar-fallback" id="avatarFallback">👤</span><img id="profileAvatar" class="profile-avatar" alt="Profile photo" hidden><span class="profile-name" id="profileName">Login</span></a><div class="profile-menu" id="profileMenu" hidden><div class="profile-menu-user"><img id="menuAvatar" class="menu-avatar" alt="Profile photo" hidden><div><strong id="menuName">Guest</strong><small id="menuEmail">Not signed in</small></div></div><a href="login.html">Account</a><button id="menuLogout" type="button" hidden>Log out</button></div></div></header><main class="app-shell"><section class="hero compact"><div class="badge">📡 ANIME PULSE</div><h1>Every update.<br><span>One place.</span></h1><p>Followed anime updates, next episodes, season changes, status changes and real anime news.</p><div class="actions"><a class="btn secondary" href="anime.html">← Anime Hub</a><a class="btn secondary" href="anime-search.html">🔎 Add Anime</a></div></section><section class="modules"><div class="pulse-filter"><button class="btn secondary active" data-filter="all">All</button><button class="btn secondary" data-filter="episode">Episodes</button><button class="btn secondary" data-filter="news">News</button><button class="btn secondary" data-filter="status">Status</button></div><div id="status" aria-live="polite">Loading your Anime Pulse…</div><div id="progress"></div><div id="feed"></div></section></main><script type="module">import{getCurrentUser,loadSubscriptions,saveSubscription,deleteSubscription,fetchAnimeDetails,fetchAnimeNews,escapeHtml}from'./anime-api.js?v=11';const status=document.getElementById('status'),feed=document.getElementById('feed'),progress=document.getElementById('progress');let items=[],filter='all',loadedSubs=[];const localKey='mgAnimeSubscriptions',cacheKey='mgAnimePulseCacheV3',CACHE_TTL=5*60*1000;function localSubs(){try{const x=JSON.parse(localStorage.getItem(localKey)||'[]');return Array.isArray(x)?x:[]}catch{return[]}}function cacheGet(){try{const x=JSON.parse(localStorage.getItem(cacheKey)||'{}');return x&&typeof x==='object'?x:{}}catch{return{}}}function cacheSet(x){try{localStorage.setItem(cacheKey,JSON.stringify(x))}catch{}}function esc(v){return escapeHtml(v??'')}function fmtDate(v){if(!v)return'';if(typeof v==='object'&&v.year)return`${String(v.day||1).padStart(2,'0')}/${String(v.month||1).padStart(2,'0')}/${v.year}`;const d=new Date(v);return Number.isNaN(d.getTime())?'':`${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`}function toMs(v){if(!v)return 0;if(typeof v==='object'&&v.year)return new Date(v.year,(v.month||1)-1,v.day||1).getTime();const n=Number(v);if(Number.isFinite(n))return n;const d=new Date(v).getTime();return Number.isFinite(d)?d:0}function fmtDateTime(v){const d=new Date(toMs(v));if(Number.isNaN(d.getTime()))return'';return`${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')} ${d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}`}function animeId(sub){const n=Number(sub?.malId||String(sub?.id||'').replace('anime:mal:',''));return Number.isInteger(n)&&n>0?n:null}async function getSubs(){const local=localSubs();try{const u=await getCurrentUser();if(!u)return local;const cloud=await loadSubscriptions();return Array.isArray(cloud)&&cloud.length?cloud:local}catch{return local}}function makeUpdates(sub,a){const out=[],name=a.englishTitle||a.title||sub.title||'Anime',id=a.malId||animeId(sub);const next=toMs(a.nextEpisodeAt);if(String(a.status).toLowerCase()==='currently airing'){if(next>Date.now()){const ep=Number(a.nextEpisode);out.push({type:'episode',date:next,title:Number.isFinite(ep)?`Episode ${ep} next`:'Next episode scheduled',text:`Next episode: ${fmtDateTime(next)}.`,animeId:id,name})}else if(a.broadcastDay&&a.broadcastTime){out.push({type:'episode',date:Date.now(),title:'Next episode schedule available',text:`Usually airs ${a.broadcastDay} at ${a.broadcastTime}${a.broadcastTimezone?` · ${a.broadcastTimezone}`:''}.`,animeId:id,name})}out.push({type:'status',date:toMs(a.startDate)||Date.now(),title:'Currently airing',text:`Release date: ${fmtDate(a.startDate)||'Release date not available'} · ${a.episodes?`${a.episodes} episode${a.episodes===1?'':'s'} released so far.`:'Episode count not available'}`,animeId:id,name})}else{const s=String(a.status||'Unknown');out.push({type:'status',date:toMs(a.endDate||a.startDate)||Date.now(),title:s==='Discontinued'||s.toLowerCase().includes('cancel')?'Anime was discontinued':`Status: ${s}`,text:`Release date: ${fmtDate(a.startDate)||'Release date not available'} · End date: ${fmtDate(a.endDate)||'End date not available'}${a.season?` · ${a.season} ${a.seasonYear||''}`:''}.`,animeId:id,name})}return out}function makeNews(sub,news){const id=animeId(sub);return(news||[]).map(n=>({type:'news',date:toMs(n.date)||Date.now(),title:n.title||'Anime news',text:n.excerpt||'New anime news is available.',url:n.url||'',animeId:id,name:sub.title||'Anime'}))}function render(){const visible=items.filter(x=>filter==='all'||x.type===filter).sort((a,b)=>(b.date||0)-(a.date||0));status.textContent=`${visible.length} update${visible.length===1?'':'s'} from your anime`;feed.innerHTML=visible.length?visible.map(x=>`<article class="anime-card pulse-item"><div class="anime-card-copy"><div class="badge">${x.type==='episode'?'⏳ NEXT EPISODE':x.type==='news'?'📰 NEWS':'📌 STATUS'}</div><h3>${esc(x.name)}</h3><div class="pulse-update ${x.type==='news'?'pulse-news':''}"><strong>${esc(x.title)}</strong><p>${esc(x.text)}</p><div class="pulse-meta">${esc(fmtDateTime(x.date))}</div>${x.url?`<div class="pulse-actions"><a class="btn secondary" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">Read news ↗</a></div>`:''}</div>${x.animeId?`<div class="pulse-actions"><a class="btn secondary" href="anime-detail.html?id=${encodeURIComponent(x.animeId)}">Details</a></div>`:''}</div></article>`).join(''):'<article class="anime-card pulse-empty"><div class="anime-card-copy"><h3>No updates in this filter</h3><p>Try All, Episodes, News, or Status.</p></div></article>'}function showProgress(text){progress.innerHTML=`<div class="pulse-progress">${esc(text)}</div>`}async function loadNews(){if(!loadedSubs.length)return;const cache=cacheGet();const pending=loadedSubs.filter(s=>{const id=animeId(s),c=id?cache[String(id)]:null;return id&&!c?.newsAt||id&&Date.now()-c.newsAt>CACHE_TTL});if(!pending.length){items=[];loadedSubs.forEach(s=>{const id=animeId(s),c=id?cache[String(id)]:null;if(c?.details)items.push(...c.details);if(c?.news)items.push(...c.news)});render();return}showProgress(`📰 Refreshing news for ${pending.length} anime…`);await Promise.all(pending.map(async sub=>{const id=animeId(sub);if(!id)return;try{const news=await fetchAnimeNews(id,3);const c=cacheGet();c[String(id)]={...(c[String(id)]||{}),news:makeNews(sub,news),newsAt:Date.now()};cacheSet(c)}catch{}}));items=[];const fresh=cacheGet();loadedSubs.forEach(s=>{const id=animeId(s),c=id?fresh[String(id)]:null;if(c?.details)items.push(...c.details);if(c?.news)items.push(...c.news)});render();showProgress(`✓ ${loadedSubs.length} followed anime checked. News is refreshed where available.`)}async function load(){status.textContent='Loading your Anime Pulse…';progress.innerHTML='';feed.innerHTML='';try{loadedSubs=(await getSubs()).filter(Boolean).slice(0,12);if(!loadedSubs.length){status.textContent='No followed anime yet.';feed.innerHTML='<article class="anime-card pulse-empty"><div class="anime-card-copy"><h3>📡 Start your Anime Pulse</h3><p>Open Search → choose an anime → tap Subscribe.</p><a class="btn primary" href="anime-search.html">Search Anime</a></div></article>';return}const cache=cacheGet();items=[];let ready=0;loadedSubs.forEach(sub=>{const id=animeId(sub),c=id?cache[String(id)]:null;if(c?.details&&Date.now()-c.detailsAt<CACHE_TTL){items.push(...c.details);ready++}});render();showProgress(`⚡ ${ready}/${loadedSubs.length} anime loaded. Checking latest data…`);for(const sub of loadedSubs){const id=animeId(sub);if(!id){ready++;continue}const old=cacheGet()[String(id)];if(old?.details&&Date.now()-old.detailsAt<CACHE_TTL)continue;try{const a=await fetchAnimeDetails(id);const detailItems=makeUpdates(sub,a);const c=cacheGet();c[String(id)]={...(c[String(id)]||{}),details:detailItems,detailsAt:Date.now()};cacheSet(c);items.push(...detailItems);ready++;render();showProgress(`⚡ ${ready}/${loadedSubs.length} anime checked…`)}catch(e){console.warn('Pulse anime failed',id,e);const c=cacheGet();if(c[String(id)]?.details)items.push(...c[String(id)].details);ready++;render();showProgress(`⚠️ ${ready}/${loadedSubs.length} anime checked. Some provider data is unavailable.`)}}render();showProgress(`✓ ${loadedSubs.length} followed anime checked. Episode and status data are ready.`);if(filter==='all'||filter==='news')await loadNews()}catch(e){console.error(e);status.textContent='Your subscriptions could not be read.';feed.innerHTML='<article class="anime-card pulse-empty"><div class="anime-card-copy"><h3>📡 Pulse needs a refresh</h3><p>Your saved subscriptions were not deleted. Try again.</p><button class="btn primary" id="retryBtn">Retry</button></div></article>';document.getElementById('retryBtn').onclick=load}}document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=async()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render();if(filter==='all'||filter==='news')await loadNews()});load();</script><script type="module" src="auth-ui.js?v=11"></script></body></html>
