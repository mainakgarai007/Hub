<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Anime details, seasons, episodes, language information and recommendations."><title>Anime Details — MG Master Hub</title><link rel="stylesheet" href="style.css?v=19"></head><body><header class="site-header app-shell"><a class="brand" href="index.html">⚡ MG Master Hub</a><div class="profile-area" id="profileArea"><a class="profile-btn" href="login.html" id="profileButton" aria-label="Open profile"><span class="avatar-fallback" id="avatarFallback">👤</span><img id="profileAvatar" class="profile-avatar" alt="Profile photo" hidden><span class="profile-name" id="profileName">Login</span></a><div class="profile-menu" id="profileMenu" hidden><div class="profile-menu-user"><img id="menuAvatar" class="menu-avatar" alt="Profile photo" hidden><div><strong id="menuName">Guest</strong><small id="menuEmail">Not signed in</small></div></div><a href="login.html">Account</a><button id="menuLogout" type="button" hidden>Log out</button></div></div></header><main class="app-shell"><section class="hero compact"><div class="badge">🎌 ANIME DETAILS</div><h1 id="title">Loading<br><span>anime.</span></h1><p id="intro">Loading anime information…</p><div class="actions"><a class="btn secondary" href="anime.html">← Anime Hub</a><a class="btn secondary" href="anime-search.html">🔎 Search</a></div></section><section class="modules"><div id="status" aria-live="polite">Loading details…</div><div id="details"></div><section id="seasonsSection" hidden><h2>📺 Seasons & Related</h2><div id="seasons" class="anime-grid"></div></section><section id="languageSection" hidden><h2>🌐 Language & Dub</h2><div id="languages" class="anime-grid"></div></section><section><h2>✨ Recommendations</h2><div id="recommendations" class="anime-grid"></div></section></section></main><script type="module">import{fetchAnimeDetails,fetchAnimeRecommendations,animeCard,escapeHtml,getCurrentUser,saveSubscription,loadSubscriptions,getPreferredLanguage}from'./anime-api.js?v=3';const id=new URLSearchParams(location.search).get('id'),title=document.getElementById('title'),intro=document.getElementById('intro'),status=document.getElementById('status'),details=document.getElementById('details'),seasonsSection=document.getElementById('seasonsSection'),seasons=document.getElementById('seasons'),languageSection=document.getElementById('languageSection'),languages=document.getElementById('languages'),recommendations=document.getElementById('recommendations');const localKey='mgAnimeSubscriptions';const localSaved=()=>{try{const v=JSON.parse(localStorage.getItem(localKey)||'[]');return Array.isArray(v)?v:[]}catch{return[]}};async function getSubs(){try{const u=await getCurrentUser();if(u)return await loadSubscriptions()}catch{}return localSaved()}async function subscribe(a){const preferred=await getPreferredLanguage();const item={id:a.id,malId:a.malId||null,title:a.englishTitle||a.title||'Unknown',language:preferred||'Hindi',reminder:'1 hour',newEpisode:true,news:true,trailer:false,added:Date.now(),source:a.provider||'unknown'};try{const cloud=await saveSubscription(item);return cloud}catch{}const list=localSaved(),i=list.findIndex(x=>String(x.id)===String(item.id));if(i>=0)list[i]=item;else list.push(item);localStorage.setItem(localKey,JSON.stringify(list));return false}function relationTitle(x){return x.relationType==='SEQUEL'?'Next / Sequel':x.relationType==='PREQUEL'?'Previous / Prequel':x.relationType.replaceAll('_',' ')}async function load(){if(!id){status.textContent='No anime was selected.';intro.textContent='Open an anime from Search or another Anime list.';return}try{const a=await fetchAnimeDetails(id),name=a.englishTitle||a.title;document.title=`${name} — MG Master Hub`;title.innerHTML=`${escapeHtml(name)}<br><span>details.</span>`;intro.textContent=a.synopsis||'No synopsis available.';const subs=await getSubs(),saved=subs.some(x=>String(x.id)===String(a.id));const genres=a.genres?.length?`<p>Genres: ${escapeHtml(a.genres.join(', '))}</p>`:'';const trailer=a.trailer?`<a class="btn secondary" target="_blank" rel="noopener noreferrer" href="${escapeHtml(a.trailer)}">▶ Trailer</a>`:'';const next=a.nextAiringEpisode?`<p>Next episode: Episode ${escapeHtml(a.nextAiringEpisode?.episode??a.nextEpisode??'—')} · ${escapeHtml(new Date(a.nextAiringEpisode.airingAt*1000).toLocaleString())}</p>`:'';const subscribeButton=`<button id="subscribeBtn" class="btn primary">${saved?'✓ Subscribed':'🔔 Subscribe'}</button>`;status.textContent=`${a.type||'Anime'} · ${a.status||'Unknown'} · ${a.year||'—'}`;details.innerHTML=`<article class="anime-card"><img src="${escapeHtml(a.image||'')}" alt="${escapeHtml(name)}" loading="lazy"><div class="anime-card-copy"><h3>${escapeHtml(name)}</h3><p>⭐ ${escapeHtml(a.score??'—')} · ${escapeHtml(a.episodes??'—')} total episodes</p><p>${escapeHtml(a.duration||'')} · ${escapeHtml(a.rating||'')}</p><p>First release: ${escapeHtml(a.startDate?.year||a.year||'—')} · ${a.endDate?.year?`Ended: ${escapeHtml(a.endDate.year)}`:'Currently/unknown end date'}</p>${a.season?`<p>Season: ${escapeHtml(a.season)} ${escapeHtml(a.seasonYear||'')}</p>`:''}${genres}${next}<div class="card-actions">${trailer}${subscribeButton}</div></div></article>`;document.getElementById('subscribeBtn').onclick=async e=>{const b=e.currentTarget;b.disabled=true;const cloud=await subscribe(a);b.textContent='✓ Subscribed';status.textContent=cloud?'Subscription synced to your account.':'Subscription saved on this device.'};const rel=(a.seasons||[]).filter(x=>x.malId);if(rel.length){seasonsSection.hidden=false;seasons.innerHTML=rel.map(x=>`<article class="anime-card"><img src="${escapeHtml(x.image||'')}" alt="${escapeHtml(x.title)}" loading="lazy"><div class="anime-card-copy"><h3>${escapeHtml(x.englishTitle||x.title)}</h3><p>${escapeHtml(relationTitle(x))} · ${escapeHtml(x.year||'—')}</p><p>${escapeHtml(x.episodes??'—')} episodes · ⭐ ${escapeHtml(x.score??'—')}</p><a class="btn secondary" href="anime-detail.html?id=${encodeURIComponent(x.malId)}">Open</a></div></article>`).join('')}else{seasonsSection.hidden=false;seasons.innerHTML='<article class="anime-card"><div class="anime-card-copy"><h3>No season/related data available</h3><p>More relationship data may appear when the provider has it.</p></div></article>'}languageSection.hidden=false;languages.innerHTML=['Japanese','English','Hindi','Bengali'].map(lang=>`<article class="anime-card"><div class="anime-card-copy"><h3>${lang}</h3><p>${lang==='Japanese'?'Original language':'Dub/release availability is provider-dependent.'}</p></div></article>`).join('');const rec=a.recommendations?.length?a.recommendations:await fetchAnimeRecommendations(id);recommendations.innerHTML=rec.length?rec.map(x=>animeCard(x)).join(''):'<article class="anime-card"><div class="anime-card-copy"><h3>No recommendations available</h3><p>Try another title.</p></div></article>'}catch(e){console.error(e);status.textContent='Could not load anime details. Please try again.'}}load();</script><script type="module" src="auth-ui.js?v=4"></script></body></html>
