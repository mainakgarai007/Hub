<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Login — MG Master Hub</title><link rel="stylesheet" href="style.css?v=7"></head><body><main class="app-shell"><section class="hero auth-hero"><div class="auth-wrap"><div class="badge">🔐 ACCOUNT</div><h1>MG Master <span>Hub</span></h1><p>Sign in to sync your account and anime preferences.</p><div class="auth-card" id="authCard"><div class="auth-tabs"><button class="auth-tab active" id="loginTab" type="button">Login</button><button class="auth-tab" id="signupTab" type="button">Sign up</button></div><form id="authForm"><div class="auth-field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></div><div class="auth-field"><label for="password">Password</label><input id="password" type="password" minlength="6" autocomplete="current-password" required placeholder="At least 6 characters"></div><button class="auth-submit" id="authSubmit" type="submit">Login</button></form><div class="divider"><span>or</span></div><button class="google-btn" id="googleBtn" type="button">🌐 Continue with Google</button><div class="auth-message" id="authMessage" role="status" aria-live="polite"></div></div><div class="auth-card account-panel" id="accountPanel"><div class="profile-large"><img id="accountAvatar" alt="Profile photo" hidden><span id="accountFallback">👤</span></div><h2 id="accountName">Welcome!</h2><p id="accountEmail"></p><button class="logout-btn" id="logoutBtn" type="button">Log out</button></div><div class="actions home-actions"><a class="btn secondary" href="index.html">← Back to Hub</a><a class="btn secondary" href="anime.html">Open Anime</a></div></div></section></main><script type="module">import{initFirebase}from './app.js?v=8';const loginTab=document.getElementById('loginTab'),signupTab=document.getElementById('signupTab'),form=document.getElementById('authForm'),submit=document.getElementById('authSubmit'),google=document.getElementById('googleBtn'),msg=document.getElementById('authMessage'),card=document.getElementById('authCard'),panel=document.getElementById('accountPanel'),emailEl=document.getElementById('accountEmail'),nameEl=document.getElementById('accountName'),avatar=document.getElementById('accountAvatar'),fallback=document.getElementById('accountFallback'),logout=document.getElementById('logoutBtn');let mode='login';const message=(t,c='')=>{msg.textContent=t;msg.className=`auth-message ${c}`};const modeSet=m=>{mode=m;loginTab.classList.toggle('active',m==='login');signupTab.classList.toggle('active',m==='signup');submit.textContent=m==='login'?'Login':'Create account';message('')};loginTab.onclick=()=>modeSet('login');signupTab.onclick=()=>modeSet('signup');const friendly=e=>({'auth/email-already-in-use':'This email already has an account. Try Login.','auth/invalid-email':'Please enter a valid email address.','auth/weak-password':'Password should be at least 6 characters.','auth/invalid-credential':'Email or password is incorrect.','auth/popup-closed-by-user':'Google sign-in was cancelled.','auth/popup-blocked':'Google sign-in popup was blocked. Use the Google button again or allow popups.','auth/unauthorized-domain':'This website is not authorized for Google sign-in. Add mainakgarai007.github.io to Firebase Authentication → Settings → Authorized domains.','auth/account-exists-with-different-credential':'This email is already registered with another sign-in method.'}[e.code]||e.message);(async()=>{const f=await initFirebase();if(!f){message('Firebase could not initialize.','error');return}const{auth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,GoogleAuthProvider,signInWithPopup,signOut}=f;onAuthStateChanged(auth,u=>{if(u){card.style.display='none';panel.style.display='block';nameEl.textContent=u.displayName||'Welcome!';emailEl.textContent=u.email||'';if(u.photoURL){avatar.src=u.photoURL;avatar.hidden=false;fallback.hidden=true}}else{card.style.display='block';panel.style.display='none';avatar.hidden=true;fallback.hidden=false}});form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;message('Working…');try{const em=document.getElementById('email').value.trim(),pw=document.getElementById('password').value;if(mode==='signup')await createUserWithEmailAndPassword(auth,em,pw);else await signInWithEmailAndPassword(auth,em,pw);message('Success!','success')}catch(e){message(friendly(e),'error')}finally{submit.disabled=false}};google.onclick=async()=>{google.disabled=true;message('Opening Google sign-in…');try{await signInWithPopup(auth,new GoogleAuthProvider());message('Google sign-in successful!','success')}catch(e){message(friendly(e),'error')}finally{google.disabled=false}};logout.onclick=()=>signOut(auth)})();</script></body></html>
