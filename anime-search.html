<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Anime Search — MG Master Hub</title><link rel="stylesheet" href="style.css?v=8"></head><body><header class="site-header app-shell"><a class="brand" href="index.html">⚡ MG Master Hub</a><div class="profile-area" id="profileArea"><a class="profile-btn" href="login.html" id="profileButton"><span class="avatar-fallback" id="avatarFallback">👤</span><img id="profileAvatar" class="profile-avatar" alt="Profile photo" hidden><span class="profile-name" id="profileName">Login</span></a><div class="profile-menu" id="profileMenu" hidden><div class="profile-menu-user"><img id="menuAvatar" class="menu-avatar" alt="Profile photo" hidden><div><strong id="menuName">Guest</strong><small id="menuEmail">Not signed in</small></div></div><a href="login.html">Account</a><button id="menuLogout" type="button" hidden>Log out</button></div></div></header><main class="app-shell"><section class="hero compact"><div class="badge">🔎 ANIME SEARCH</div><h1>Find your<br><span>anime.</span></h1><p>Search the Jikan database with automatic fallback support when Jikan is temporarily unavailable.</p><form id="searchForm" class="search-box"><input id="query" required maxlength="80" placeholder="Search anime..." autocomplete="off"><button class="btn primary" id="searchButton" type="submit">Search</button></form><div class="actions"><a class="btn secondary" href="anime.html">← Anime Hub</a></div></section><section class="modules"><div id="status" aria-live="polite"></div><div id="results" class="anime-grid"></div></section></main><script type="module">import{searchAnime,animeCard}from './app.js?v=8';const form=document.getElementById('searchForm'),query=document.getElementById('query'),results=document.getElementById('results'),status=document.getElementById('status'),button=document.getElementById('searchButton');const run=async()=>{const q=query.value.trim();if(!q)return;button.disabled=true;button.textContent='Searching…';status.textContent='Searching…';results.innerHTML='';try{const data=await searchAnime(q);status.textContent=data.length?`${data.length} results found`:'No anime found.';results.innerHTML=data.map(animeCard).join('')}catch(err){console.error(err);status.textContent='Anime data is temporarily unavailable. Please try again shortly.'}finally{button.disabled=false;button.textContent='Search'}};form.addEventListener('submit',e=>{e.preventDefault();run()});</script></body></html>
