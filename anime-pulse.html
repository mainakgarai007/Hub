<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Anime Pulse — follow anime and see important updates in one place."><title>Anime Pulse — MG Master Hub</title><link rel="stylesheet" href="style.css?v=24"><style>.pulse-filter{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.pulse-filter button.active{outline:2px solid #7c8cff}.pulse-item{margin-bottom:14px}.pulse-meta{opacity:.72;font-size:.9rem}.pulse-empty{padding:22px}.pulse-update{border-left:3px solid #7c8cff;padding-left:12px;margin-top:12px}.pulse-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.pulse-loading{opacity:.8}.pulse-error{border-left:3px solid #ff9b9b;padding-left:12px}.pulse-news{border-left-color:#f4c95d}.pulse-news a{word-break:break-word}.pulse-date{font-size:.92rem;opacity:.86}</style></head><body><header class="site-header app-shell"><a class="brand" href="index.html">⚡ MG Master Hub</a><div class="profile-area" id="profileArea"><a class="profile-btn" href="login.html" id="profileButton" aria-label="Open profile"><span class="avatar-fallback" id="avatarFallback">👤</span><img id="profileAvatar" class="profile-avatar" alt="Profile photo" hidden><span class="profile-name" id="profileName">Login</span></a><div class="profile-menu" id="profileMenu" hidden><div class="profile-menu-user"><img id="menuAvatar" class="menu-avatar" alt="Profile photo" hidden><div><strong id="menuName">Guest</strong><small id="menuEmail">Not signed in</small></div></div><a href="login.html">Account</a><button id="menuLogout" type="button" hidden>Log out</button></div></div></header><main class="app-shell"><section class="hero compact"><div class="badge">📡 ANIME PULSE</div><h1>Every update.<br><span>One place.</span></h1><p>Followed anime updates, next episodes, season changes, status changes and real anime news.</p><div class="actions"><a class="btn secondary" href="anime.html">← Anime Hub</a><a class="btn secondary" href="anime-search.html">🔎 Add Anime</a></div></section><section class="modules"><div class="pulse-filter"><button class="btn secondary active" data-filter="all">All</button><button class="btn secondary" data-filter="episode">Episodes</button><button class="btn secondary" data-filter="news">News</button><button class="btn secondary" data-filter="status">Status</button></div><div id="status" aria-live="polite">Loading your Anime Pulse…</div><div id="feed"></div></section></main><script type="module">import{getCurrentUser,loadSubscriptions,saveSubscription,fetchAnimeDetails,fetchAnimeNews,escapeHtml}from'./anime-api.js?v=7';const status=document.getElementById('status'),feed=document.getElementById('feed');let items=[],filter='all';const localKey='mgAnimeSubscriptions';function localSubs(){try{const x=JSON.parse(localStorage.getItem(localKey)||'[]');return Array.isArray(x)?x:[]}catch{return[]}}function fmtDate(v){if(!v)return'';let d;if(typeof v==='object'&&v.year)d=new Date(v.year,v.month?v.month-1:0,v.day||1);else d=new Date(v);if(Number.isNaN(d.getTime()))return'';return`${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`}function fmtDateTime(v){if(!v)return'';const d=new Date(v);if(Number.isNaN(d.getTime()))return'';return`${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()} ${d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}`}function esc(v){return escapeHtml(v??'')}function makeUpdates(sub,a){const out=[];if(a.nextEpisodeAt&&a.nextEpisodeAt>Date.now())out.push({type:'episode',date:a.nextEpisodeAt,title:`Episode ${a.nextEpisode??'next'} scheduled`,text:`Next episode is currently listed for ${fmtDateTime(a.nextEpisodeAt)}.`});const release=fmtDate(a.startDate)||'Release date not available';const end=fmtDate(a.endDate)||'End date not available';if(a.status==='Discontinued')out.push({type:'status',date:a.endDate||a.startDate||Date.now(),title:'Anime was discontinued',text:`Release date: ${release} · End date: ${end}.`});else out.push({type:'status',date:a.endDate||a.startDate||Date.now(),title:`Status: ${a.status||'Unknown'}`,text:`${a.type||'Anime'} · ${a.episodes??'—'} total episodes · Release date: ${release} · End date: ${end}${a.season?` · ${a.season} ${a.seasonYear||''}`:''}.`});if(a.status==='Finished Airing'&&a.seasons?.length){const sequel=a.seasons.find(x=>x.relationType==='SEQUEL'&&x.malId);if(sequel)out.push({type:'status',date:sequel.startDate||Date.now(),title:`Next season found: ${sequel.englishTitle||sequel.title}`,text:`The current season has ended. Release date: ${fmtDate(sequel.startDate)||'Release date not available'}.`})}return out.map(x=>({...x,animeId:a.malId||sub.malId||null,name:a.englishTitle||a.title||sub.title||'Anime'}))}function makeNews(sub,news){return news.map(n=>({type:'news',date:n.date||Date.now(),title:n.title||'Anime news',text:n.excerpt||'New anime news is available.',url:n.url||'',animeId:sub.malId||null,name:sub.title||'Anime'}))}function addFallback(sub,message){items.push({type:'status',date:Date.now(),title:sub.title||'Anime',text:message,animeId:sub.malId||null,name:sub.title||'Anime'})}async function getSubs(){const local=localSubs();try{const u=await getCurrentUser();if(!u)return local;try{const cloud=await loadSubscriptions();return Array.isArray(cloud)?cloud:local}catch{return local}}catch{return local}}async function advanceSeason(sub,a){if(a.status!=='Finished Airing'||!Array.isArray(a.seasons))return null;const sequel=a.seasons.find(x=>x.relationType==='SEQUEL'&&x.malId);if(!sequel)return null;const next=await fetchAnimeDetails(sequel.malId);const updated={...sub,id:next.id,malId:next.malId,title:next.englishTitle||next.title||sequel.englishTitle||sequel.title||sub.title,source:next.provider||sub.source,added:sub.added||Date.now(),updated:Date.now()};try{await saveSubscription(updated)}catch{const list=localSubs(),i=list.findIndex(x=>String(x.id)===String(sub.id));if(i>=0)list[i]=updated;else list.push(updated);localStorage.setItem(localKey,JSON.stringify(list))}return next}async function load(){status.textContent='Loading your Anime Pulse…';feed.innerHTML='';try{const subs=await getSubs();if(!subs.length){status.textContent='No followed anime yet.';feed.innerHTML='<article class="anime-card pulse-empty"><div class="anime-card-copy"><h3>📡 Start your Anime Pulse</h3><p>Open Search → choose an anime → tap Subscribe. News tracking is included.</p><a class="btn primary" href="anime-search.html">Search Anime</a></div></article>';return}items=[];const usable=subs.slice(0,12);status.textContent=`Refreshing ${usable.length} followed anime…`;for(const originalSub of usable){let sub=originalSub;const id=Number(sub.malId||String(sub.id||'').replace('anime:mal:',''));if(!Number.isInteger(id)||id<1){addFallback(sub,'This subscription does not have a supported anime ID yet.');continue}try{let a=await fetchAnimeDetails(id);if(a.status==='Finished Airing'){try{const next=await advanceSeason(sub,a);if(next){items.push({type:'status',date:Date.now(),title:`Season ended → now following ${next.englishTitle||next.title||'next season'}`,text:`The previous season finished, so Anime Pulse automatically moved this subscription to the next season. Release date: ${fmtDate(next.startDate)||'Release date not available'}.`,animeId:next.malId,name:next.englishTitle||next.title||sub.title});sub={...sub,id:next.id,malId:next.malId,title:next.englishTitle||next.title||sub.title};a=next}}catch(e){console.warn('Season advance failed',e)}}items.push(...makeUpdates(sub,a));try{const news=await fetchAnimeNews(a.malId||id,5);items.push(...makeNews(sub,news))}catch{items.push({type:'status',date:Date.now(),title:'News temporarily unavailable',text:'The anime is still followed, but its news feed could not be refreshed right now.',animeId:a.malId||id,name:sub.title||'Anime'})}}catch{addFallback(sub,'Latest anime metadata is temporarily unavailable. Your subscription is still saved.')}}render()}catch(e){console.error(e);status.textContent='Your subscriptions could not be read.';feed.innerHTML='<article class="anime-card pulse-empty"><div class="anime-card-copy"><h3>📡 Pulse needs a refresh</h3><p>Your Anime Pulse could not read the subscription list. Your saved subscriptions were not deleted.</p><button class="btn primary" id="retryBtn">Retry</button></div></article>';document.getElementById('retryBtn').onclick=load}}function render(){const visible=items.filter(x=>filter==='all'||x.type===filter).sort((a,b)=>(b.date||0)-(a.date||0));status.textContent=`${visible.length} update${visible.length===1?'':'s'} from your anime`;feed.innerHTML=visible.length?visible.map(x=>`<article class="anime-card pulse-item"><div class="anime-card-copy"><div class="badge">${x.type==='episode'?'⏳ NEXT EPISODE':x.type==='news'?'📰 NEWS':'📌 STATUS'}</div><h3>${esc(x.name)}</h3><div class="pulse-update ${x.type==='news'?'pulse-news':''}"><strong>${esc(x.title)}</strong><p>${esc(x.text)}</p><div class="pulse-meta">${esc(fmtDateTime(x.date))}</div>${x.url?`<div class="pulse-actions"><a class="btn secondary" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">Read news ↗</a></div>`:''}</div><div class="pulse-actions">${x.animeId?`<a class="btn secondary" href="anime-detail.html?id=${encodeURIComponent(x.animeId)}">Details</a>`:''}</div></div></article>`).join(''):'<article class="anime-card pulse-empty"><div class="anime-card-copy"><h3>No updates in this filter</h3><p>Try All, Episodes, News, or Status.</p></div></article>'}document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});load();</script><script type="module" src="auth-ui.js?v=8"></script></body></html>
