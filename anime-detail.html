<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Anime details, metadata, trailer links and recommendations."><title>Anime Details — MG Master Hub</title><link rel="stylesheet" href="style.css?v=18"></head><body><header class="site-header app-shell"><a class="brand" href="index.html">⚡ MG Master Hub</a><div class="profile-area" id="profileArea"><a class="profile-btn" href="login.html" id="profileButton" aria-label="Open profile"><span class="avatar-fallback" id="avatarFallback">👤</span><img id="profileAvatar" class="profile-avatar" alt="Profile photo" hidden><span class="profile-name" id="profileName">Login</span></a><div class="profile-menu" id="profileMenu" hidden><div class="profile-menu-user"><img id="menuAvatar" class="menu-avatar" alt="Profile photo" hidden><div><strong id="menuName">Guest</strong><small id="menuEmail">Not signed in</small></div></div><a href="login.html">Account</a><button id="menuLogout" type="button" hidden>Log out</button></div></div></header><main class="app-shell"><section class="hero compact"><div class="badge">🎌 ANIME DETAILS</div><h1 id="title">Loading<br><span>anime.</span></h1><p id="intro">Loading anime information…</p><div class="actions"><a class="btn secondary" href="anime.html">← Anime Hub</a><a class="btn secondary" href="anime-search.html">🔎 Search</a></div></section><section class="modules"><div id="status" aria-live="polite">Loading details…</div><div id="details" class="anime-grid"></div><h2>Recommendations</h2><div id="recommendations" class="anime-grid"></div></section></main><script type="module">import{fetchAnimeDetails,fetchAnimeRecommendations,animeCard,escapeHtml}from'./app.js?v=18';const id=new URLSearchParams(location.search).get('id'),title=document.getElementById('title'),intro=document.getElementById('intro'),status=document.getElementById('status'),details=document.getElementById('details'),recommendations=document.getElementById('recommendations');async function load(){if(!id){status.textContent='No anime was selected.';intro.textContent='Open an anime from Search or another Anime list.';return}try{const a=await fetchAnimeDetails(id),name=a.englishTitle||a.title;document.title=`${name} — MG Master Hub`;title.innerHTML=`${escapeHtml(name)}<br><span>details.</span>`;intro.textContent=a.synopsis||'No synopsis available.';status.textContent=`${a.type||'Anime'} · ${a.status||'Unknown'} · ${a.year||'—'}`;const genres=a.genres?.length?`<p>Genres: ${escapeHtml(a.genres.join(', '))}</p>`:'';const trailer=a.trailer?`<a class="btn secondary" target="_blank" rel="noopener noreferrer" href="${escapeHtml(a.trailer)}">▶ Trailer</a>`:'';details.innerHTML=`<article class="anime-card"><img src="${escapeHtml(a.image||'')}" alt="${escapeHtml(name)}" loading="lazy"><div class="anime-card-copy"><h3>${escapeHtml(name)}</h3><p>⭐ ${escapeHtml(a.score??'—')} · ${escapeHtml(a.episodes??'—')} episodes</p><p>${escapeHtml(a.duration||'')} · ${escapeHtml(a.rating||'')}</p>${genres}<p>${escapeHtml(a.synopsis||'Synopsis unavailable.')}</p><div class="card-actions">${trailer}<a class="btn primary" href="anime-feature.html?feature=recommendations&id=${encodeURIComponent(a.malId||'')}">✨ Recommendations</a></div></div></article>`;const rec=await fetchAnimeRecommendations(id);recommendations.innerHTML=rec.length?rec.map(x=>animeCard(x)).join(''):'<article class="anime-card"><div class="anime-card-copy"><h3>No recommendations available</h3><p>Try another title.</p></div></article>'}catch(e){console.error(e);status.textContent='Could not load anime details. Please try again.'}}load();</script><script type="module" src="auth-ui.js?v=3"></script></body></html>
