<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Anime Search — MG Master Hub</title>
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body data-page="anime-search">
  <header class="site-header app-shell">
    <a class="brand" href="index.html">⚡ MG Master Hub</a>
    <div class="profile-area" id="profileArea">
      <a class="profile-btn" href="login.html" id="profileButton" aria-label="Open profile">
        <span class="avatar-fallback" id="avatarFallback">👤</span>
        <img id="profileAvatar" class="profile-avatar" alt="Profile photo" hidden>
        <span class="profile-name" id="profileName">Login</span>
      </a>
      <div class="profile-menu" id="profileMenu" hidden>
        <div class="profile-menu-user">
          <img id="menuAvatar" class="menu-avatar" alt="Profile photo" hidden>
          <div><strong id="menuName">Guest</strong><small id="menuEmail">Not signed in</small></div>
        </div>
        <a href="login.html">Account</a>
        <button type="button" id="menuLogout" hidden>Log out</button>
      </div>
    </div>
  </header>

  <main class="app-shell">
    <section class="hero" style="min-height:auto;padding-bottom:30px">
      <div class="badge">🔎 ANIME SEARCH</div>
      <h1>Find your<br><span>anime.</span></h1>
      <p>Search the Jikan anime database and explore titles, scores, type and status.</p>
      <form id="searchForm" class="search-box">
        <input id="query" required maxlength="80" placeholder="Search anime..." autocomplete="off">
        <button class="btn primary" id="searchButton" type="submit">Search</button>
      </form>
      <div class="actions"><a class="btn secondary" href="anime.html">← Anime Hub</a></div>
    </section>
    <section class="modules">
      <div id="status"></div>
      <div id="results" class="anime-grid"></div>
    </section>
  </main>

  <script type="module">
    import { initFirebase } from './app.js?v=5';
    window.addEventListener('DOMContentLoaded', () => initFirebase());
  </script>
  <script src="app.js?v=5"></script>
  <script>
    const form = document.getElementById('searchForm');
    const query = document.getElementById('query');
    const results = document.getElementById('results');
    const status = document.getElementById('status');
    const button = document.getElementById('searchButton');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const q = query.value.trim();
      if (!q) return;
      button.disabled = true;
      button.textContent = 'Searching…';
      status.textContent = 'Searching Jikan…';
      results.innerHTML = '';
      try {
        const data = await MGHub.searchAnime(q);
        status.textContent = data.length ? `${data.length} results found` : 'No anime found.';
        results.innerHTML = data.map(MGHub.animeCard).join('');
      } catch (error) {
        console.error(error);
        status.textContent = 'Anime API is temporarily unavailable. Please try again in a moment.';
      } finally {
        button.disabled = false;
        button.textContent = 'Search';
      }
    });
  </script>
</body>
</html>
