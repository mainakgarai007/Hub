<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Anime Feature — MG Master Hub</title><link rel="stylesheet" href="style.css?v=10"></head><body><header class="site-header app-shell"><a class="brand" href="index.html">⚡ MG Master Hub</a><div class="profile-area" id="profileArea"><a class="profile-btn" href="login.html" id="profileButton"><span class="avatar-fallback" id="avatarFallback">👤</span><img id="profileAvatar" class="profile-avatar" alt="Profile photo" hidden><span class="profile-name" id="profileName">Login</span></a><div class="profile-menu" id="profileMenu" hidden><div class="profile-menu-user"><img id="menuAvatar" class="menu-avatar" alt="Profile photo" hidden><div><strong id="menuName">Guest</strong><small id="menuEmail">Not signed in</small></div></div><a href="login.html">Account</a><button id="menuLogout" type="button" hidden>Log out</button></div></div></header><main class="app-shell"><section class="hero compact"><div class="badge" id="badge">🎌 ANIME</div><h1 id="title">Anime<br><span>feature.</span></h1><p id="intro">Loading…</p><div class="actions"><a class="btn secondary" href="anime.html">← Anime Hub</a><a class="btn secondary" href="anime-search.html">🔎 Search</a></div></section><section class="modules"><div id="status" aria-live="polite"></div><div id="results" class="anime-grid"></div></section></main><script type="module">import{fetchJikan,fetchCountdown,animeCard,getAnimeId,escapeHtml}from'./app.js?v=10';
const feature=new URLSearchParams(location.search).get('feature')||'new',title=document.getElementById('title'),intro=document.getElementById('intro'),badge=document.getElementById('badge'),status=document.getElementById('status'),results=document.getElementById('results');
const configs={new:['🆕 NEW RELEASES','New releases.','Browse currently airing anime.'],trending:['🔥 TRENDING','Trending anime.','Popular titles from the anime catalog.'],countdown:['⏳ COUNTDOWN','Release<br><span>countdown.</span>','Next episode countdowns when the provider supplies airing times.'],language:['🌐 LANGUAGE','Language<br><span>preferences.</span>','Choose a preferred dub/sub language when you subscribe.'],subscribed:['🔔 SUBSCRIBED','Your<br><span>anime.</span>','Manage subscriptions and notification preferences.']};
const c=configs[feature]||configs.new;badge.textContent=c[0];title.innerHTML=c[1];intro.textContent=c[2];
const saved=()=>{try{const v=JSON.parse(localStorage.getItem('mgAnimeSubscriptions')||'[]');return Array.isArray(v)?v:[]}catch{return[]}};
const save=x=>localStorage.setItem('mgAnimeSubscriptions',JSON.stringify(x));
const isSaved=a=>saved().some(x=>String(x.id)===String(getAnimeId(a)));
function subscribe(a,lang='Japanese'){if(!a)return;const list=saved(),id=getAnimeId(a),old=list.find(x=>String(x.id)===String(id));if(old){old.language=lang||old.language;old.title=a.title_english||a.title||old.title;save(list);return}list.push({id,title:a.title_english||a.title||'Unknown',language:lang,reminder:'1 hour',newEpisode:true,news:false,trailer:false,added:Date.now(),source:a._source||'unknown'});save(list)}
function editSub(id){const list=saved(),item=list.find(x=>String(x.id)===String(id));if(!item)return;const panel=document.createElement('div');panel.className='subscription-editor';panel.innerHTML=`<div class="subscription-editor-inner"><h3>✏️ Edit subscription</h3><p>${escapeHtml(item.title)}</p><label>Language<select id="editLang"><option>Japanese</option><option>English</option><option>Hindi</option><option>Bengali</option><option>Other</option></select></label><label>Release reminder<select id="editReminder"><option>Off</option><option>15 minutes</option><option>1 hour</option><option>1 day</option></select></label><label class="check"><input id="editEpisode" type="checkbox"> New episode</label><label class="check"><input id="editTrailer" type="checkbox"> Trailer updates</label><label class="check"><input id="editNews" type="checkbox"> News updates</label><div class="editor-actions"><button class="btn primary" id="saveEdit">Save</button><button class="btn secondary" id="cancelEdit">Cancel</button></div></div>`;document.body.appendChild(panel);panel.querySelector('#editLang').value=item.language||'Japanese';panel.querySelector('#editReminder').value=item.reminder||'1 hour';panel.querySelector('#editEpisode').checked=item.newEpisode!==false;panel.querySelector('#editTrailer').checked=!!item.trailer;panel.querySelector('#editNews').checked=!!item.news;panel.querySelector('#cancelEdit').onclick=()=>panel.remove();panel.querySelector('#saveEdit').onclick=()=>{item.language=panel.querySelector('#editLang').value;item.reminder=panel.querySelector('#editReminder').value;item.newEpisode=panel.querySelector('#editEpisode').checked;item.trailer=panel.querySelector('#editTrailer').checked;item.news=panel.querySelector('#editNews').checked;save(list);panel.remove();load()}}
function countdownText(ts){if(!ts)return 'Airing time unavailable';const diff=Math.max(0,ts-Date.now()),s=Math.floor(diff/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return d?`${d}d ${h}h ${m}m`:h?`${h}h ${m}m`:m?`${m}m`: 'Starting soon'}
function renderCountdown(data){status.textContent=`${data.filter(a=>a.nextEpisodeAt).length} scheduled titles`;results.innerHTML=data.map(a=>{const id=getAnimeId(a),extra=`<div class="countdown" data-countdown="${escapeHtml(id)}" data-time="${escapeHtml(a.nextEpisodeAt||'')}">⏳ ${escapeHtml(countdownText(a.nextEpisodeAt))}${a.nextEpisode?' · Episode '+escapeHtml(a.nextEpisode):''}</div><button class="btn secondary save-btn" type="button" data-id="${escapeHtml(id)}">${isSaved(a)?'✓ Subscribed':'🔔 Subscribe'}</button>`;return animeCard(a,extra)}).join('');bindButtons(data)}
function bindButtons(data){results.querySelectorAll('.save-btn').forEach(b=>b.onclick=()=>{const a=data.find(x=>String(getAnimeId(x))===String(b.dataset.id));subscribe(a);b.textContent='✓ Subscribed'});results.querySelectorAll('.lang-btn').forEach(b=>b.onclick=()=>{const a=data.find(x=>String(getAnimeId(x))===String(b.dataset.id));subscribe(a,b.dataset.lang);b.textContent='✓ '+b.dataset.lang})}
function updateCountdowns(){results.querySelectorAll('[data-countdown]').forEach(el=>{const ts=Number(el.dataset.time);if(ts)el.textContent='⏳ '+countdownText(ts)})}
async function load(){try{if(feature==='subscribed'){const list=saved();status.textContent=list.length?`${list.length} subscribed anime`:'No subscriptions yet. Search an anime and subscribe to it.';results.innerHTML=list.map(x=>`<article class="anime-card"><div class="anime-card-copy"><h3>${escapeHtml(x.title)}</h3><p>Language: ${escapeHtml(x.language||'Japanese')} · Reminder: ${escapeHtml(x.reminder||'1 hour')}</p><p>${x.newEpisode!==false?'🔔 Episode ':''}${x.trailer?'🎬 Trailer ':''}${x.news?'📰 News':''}</p><div class="subscription-actions"><button class="btn secondary" type="button" data-edit="${escapeHtml(x.id)}">✏️ Edit</button><button class="btn secondary" type="button" data-remove="${escapeHtml(x.id)}">Remove</button></div></div></article>`).join('');results.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{save(saved().filter(x=>String(x.id)!==String(b.dataset.remove)));load()});results.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editSub(b.dataset.edit));return}
let data;
if(feature==='countdown')data=await fetchCountdown();else data=feature==='trending'?await fetchJikan('/top/anime?limit=12'):await fetchJikan('/anime?status=airing&order_by=popularity&sort=asc&limit=12');
if(feature==='countdown'){renderCountdown(data);return}
status.textContent=`${data.length} titles`;
const languages=['Japanese','English','Hindi','Bengali','Other'];
results.innerHTML=data.map(a=>{const id=getAnimeId(a),savedNow=isSaved(a),extra=feature==='language'?`<p class="muted">Language release dates are not supplied by these metadata providers; choose your preferred language for this subscription.</p><div class="lang-row">${languages.map(l=>`<button class="lang-btn" type="button" data-id="${escapeHtml(id)}" data-lang="${escapeHtml(l)}">${savedNow&&saved().find(x=>String(x.id)===String(id))?.language===l?'✓ ':''}${escapeHtml(l)}</button>`).join('')}</div>`:`<button class="btn secondary save-btn" data-id="${escapeHtml(id)}" type="button">${savedNow?'✓ Subscribed':'🔔 Subscribe'}</button>`;return animeCard(a,extra)}).join('');bindButtons(data);
}catch(e){console.error(e);status.textContent='Anime data is temporarily unavailable. Please try again shortly.'}}
load();setInterval(updateCountdowns,1000);</script></body></html>
