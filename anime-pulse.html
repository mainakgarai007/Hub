<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Anime Pulse — follow anime and see important updates in one place."><title>Anime Pulse — MG Master Hub</title><link rel="stylesheet" href="style.css?v=21"><style>.pulse-filter{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.pulse-filter button.active{outline:2px solid #7c8cff}.pulse-item{margin-bottom:14px}.pulse-meta{opacity:.72;font-size:.9rem}.pulse-empty{padding:22px}.pulse-update{border-left:3px solid #7c8cff;padding-left:12px;margin-top:12px}.pulse-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}</style></head><body><header class="site-header app-shell"><a class="brand" href="index.html">⚡ MG Master Hub</a><div class="profile-area" id="profileArea"><a class="profile-btn" href="login.html" id="profileButton" aria-label="Open profile"><span class="avatar-fallback" id="avatarFallback">👤</span><img id="profileAvatar" class="profile-avatar" alt="Profile photo" hidden><span class="profile-name" id="profileName">Login</span></a><div class="profile-menu" id="profileMenu" hidden><div class="profile-menu-user"><img id="menuAvatar" class="menu-avatar" alt="Profile photo" hidden><div><strong id="menuName">Guest</strong><small id="menuEmail">Not signed in</small></div></div><a href="login.html">Account</a><button id="menuLogout" type="button" hidden>Log out</button></div></div></header><main class="app-shell"><section class="hero compact"><div class="badge">📡 ANIME PULSE</div><h1>Every update.<br><span>One place.</span></h1><p>Followed anime updates, next episodes, status changes and available news in one feed.</p><div class="actions"><a class="btn secondary" href="anime.html">← Anime Hub</a><a class="btn secondary" href="anime-search.html">🔎 Add Anime</a></div></section><section class="modules"><div class="pulse-filter"><button class="btn secondary active" data-filter="all">All</button><button class="btn secondary" data-filter="episode">Episodes</button><button class="btn secondary" data-filter="news">News</button><button class="btn secondary" data-filter="status">Status</button></div><div id="status" aria-live="polite">Loading your Anime Pulse…</div><div id="feed"></div></section></main><script type="module">import{getCurrentUser,loadSubscriptions,fetchAnimeDetails,escapeHtml}from'./anime-api.js?v=4';const status=document.getElementById('status'),feed=document.getElementById('feed');let items=[],filter='all';const localKey='mgAnimeSubscriptions';function localSubs(){try{const x=JSON.parse(localStorage.getItem(localKey)||'[]');return Array.isArray(x)?x:[]}catch{return[]}}function fmtDate(v){try{return new Date(v).toLocaleString()}catch{return String(v||'')}}function esc(v){return escapeHtml(v??'')}function makeUpdates(sub,a){const out=[];if(a.nextEpisodeAt&&a.nextEpisodeAt>Date.now()){out.push({type:'episode',date:a.nextEpisodeAt,title:`Episode ${a.nextEpisode??'next'} scheduled`,text:`Next episode is currently listed for ${fmtDate(a.nextEpisodeAt)}.`})}if(a.status){out.push({type:'status',date:a.endDate?.year?new Date(`${a.endDate.year}-12-31`).getTime():Date.now(),title:`Status: ${a.status}`,text:`${a.type||'Anime'} · ${a.episodes??'—'} total episodes${a.season?` · ${a.season} ${a.seasonYear||''}`:''}.`})}if(a.nextSeasonYear){out.push({type:'status',date:Date.now(),title:`Next / sequel year: ${a.nextSeasonYear}`,text:'A related sequel was found in the public anime metadata.'})}return out.map(x=>({...x,animeId:a.malId||sub.malId||null,name:a.englishTitle||a.title||sub.title||'Anime',image:a.image||''}))}async function load(){status.textContent='Loading your Anime Pulse…';feed.innerHTML='';try{const u=await getCurrentUser();const subs=u?await loadSubscriptions():localSubs();if(!subs.length){status.textContent='No followed anime yet.';feed.innerHTML='<article class="anime-card pulse-empty"><div class="anime-card-copy"><h3>📡 Start your Anime Pulse</h3><p>Search for an anime, open it and tap Subscribe. Its available updates will appear here.</p><a class="btn primary" href="anime-search.html">Search Anime</a></div></article>';return}items=[];for(const sub of subs.slice(0,20)){const id=Number(sub.malId||String(sub.id||'').replace('anime:mal:',''));if(!Number.isInteger(id)||id<1)continue;try{const a=await fetchAnimeDetails(id);items.push(...makeUpdates(sub,a))}catch{items.push({type:'status',date:Date.now(),title:sub.title||'Anime',text:'Latest metadata is temporarily unavailable.',animeId:id,name:sub.title||'Anime'})}}render()}catch(e){console.error(e);status.textContent='Could not load Anime Pulse right now.';feed.innerHTML='<article class="anime-card pulse-empty"><div class="anime-card-copy"><h3>Pulse unavailable</h3><p>Try again in a moment.</p><button class="btn primary" onclick="location.reload()">Retry</button></div></article>'}}function render(){const visible=items.filter(x=>filter==='all'||x.type===filter).sort((a,b)=>(b.date||0)-(a.date||0));status.textContent=`${visible.length} update${visible.length===1?'':'s'} from your anime`;feed.innerHTML=visible.length?visible.map(x=>`<article class="anime-card pulse-item"><div class="anime-card-copy"><div class="badge">${x.type==='episode'?'⏳ NEXT EPISODE':x.type==='news'?'📰 NEWS':'📌 STATUS'}</div><h3>${esc(x.name)}</h3><div class="pulse-update"><strong>${esc(x.title)}</strong><p>${esc(x.text)}</p><div class="pulse-meta">${esc(fmtDate(x.date))}</div></div><div class="pulse-actions">${x.animeId?`<a class="btn secondary" href="anime-detail.html?id=${encodeURIComponent(x.animeId)}">Details</a>`:''}</div></div></article>`).join(''):'<article class="anime-card pulse-empty"><div class="anime-card-copy"><h3>No updates in this filter</h3><p>Try All, Episodes, or Status.</p></div></article>'}document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});load();</script><script type="module" src="auth-ui.js?v=5"></script></body></html>
