<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Anime Feature — MG Master Hub</title><link rel="stylesheet" href="style.css?v=8"></head><body><header class="site-header app-shell"><a class="brand" href="index.html">⚡ MG Master Hub</a><div class="profile-area" id="profileArea"><a class="profile-btn" href="login.html" id="profileButton"><span class="avatar-fallback" id="avatarFallback">👤</span><img id="profileAvatar" class="profile-avatar" alt="Profile photo" hidden><span class="profile-name" id="profileName">Login</span></a><div class="profile-menu" id="profileMenu" hidden><div class="profile-menu-user"><img id="menuAvatar" class="menu-avatar" alt="Profile photo" hidden><div><strong id="menuName">Guest</strong><small id="menuEmail">Not signed in</small></div></div><a href="login.html">Account</a><button id="menuLogout" type="button" hidden>Log out</button></div></div></header><main class="app-shell"><section class="hero compact"><div class="badge" id="badge">🎌 ANIME</div><h1 id="title">Anime<br><span>feature.</span></h1><p id="intro">Loading…</p><div class="actions"><a class="btn secondary" href="anime.html">← Anime Hub</a><a class="btn secondary" href="anime-search.html">🔎 Search</a></div></section><section class="modules"><div id="status" aria-live="polite"></div><div id="controls" class="feature-controls"></div><div id="results" class="anime-grid"></div></section></main><script type="module">import{fetchJikan,animeCard,escapeHtml}from './app.js?v=8';const feature=new URLSearchParams(location.search).get('feature')||'new',title=document.getElementById('title'),intro=document.getElementById('intro'),badge=document.getElementById('badge'),status=document.getElementById('status'),results=document.getElementById('results');const configs={new:['🆕 NEW RELEASES','New releases.','Browse currently airing and recently released anime.'],trending:['🔥 TRENDING','Trending anime.','Popular titles from the anime catalog.'],countdown:['⏳ COUNTDOWN','Release<br><span>countdown.</span>','Upcoming broadcast information when available.'],language:['🌐 LANGUAGE RELEASES','Language<br><span>releases.</span>','Choose a language preference and save anime subscriptions.'],subscribed:['🔔 SUBSCRIBED','Your<br><span>anime.</span>','Your saved anime subscriptions on this browser.']};const c=configs[feature]||configs.new;badge.textContent=c[0];title.innerHTML=c[1];intro.textContent=c[2];const saved=()=>{try{const v=JSON.parse(localStorage.getItem('mgAnimeSubscriptions')||'[]');return Array.isArray(v)?v:[]}catch{return[]}};const save=x=>localStorage.setItem('mgAnimeSubscriptions',JSON.stringify(x));function subscribe(a,lang='Japanese'){if(!a)return;const list=saved(),id=a.mal_id;if(!list.some(x=>String(x.id)===String(id))){list.push({id,title:a.title_english||a.title||'Unknown',language:lang,added:Date.now()});save(list)}const el=document.getElementById(`save-${id}`);if(el)el.textContent='✓ Subscribed'}async function load(){try{if(feature==='subscribed'){const list=saved();status.textContent=list.length?`${list.length} subscribed anime`:'No subscriptions yet. Search an anime and subscribe to it.';results.innerHTML=list.map(x=>`<article class="anime-card"><div class="anime-card-copy"><h3>${escapeHtml(x.title)}</h3><p>Language: ${escapeHtml(x.language)}</p><button class="btn secondary" type="button" data-remove="${escapeHtml(x.id)}">Remove</button></div></article>`).join('');results.querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('click',()=>{save(saved().filter(x=>String(x.id)!==String(b.dataset.remove)));load()}));return}let data=feature==='trending'?await fetchJikan('/top/anime?limit=12'):await fetchJikan('/anime?status=airing&order_by=popularity&sort=asc&limit=12');status.textContent=`${data.length} titles`;const languages=['Japanese','English','Hindi','Bengali','Other'];results.innerHTML=data.map(a=>{const id=String(a.mal_id),extra=feature==='language'?`<div class="lang-row">${languages.map(l=>`<button class="lang-btn" type="button" data-id="${escapeHtml(id)}" data-lang="${escapeHtml(l)}">${escapeHtml(l)}</button>`).join('')}</div>`:`<button class="btn secondary save-btn" id="save-${escapeHtml(id)}" type="button">🔔 Subscribe</button>`;return animeCard(a,extra)}).join('');results.querySelectorAll('.save-btn').forEach(b=>b.addEventListener('click',()=>{const id=b.id.slice(5),a=data.find(x=>String(x.mal_id)===id);subscribe(a)}));results.querySelectorAll('.lang-btn').forEach(b=>b.addEventListener('click',()=>{const a=data.find(x=>String(x.mal_id)===String(b.dataset.id));subscribe(a,b.dataset.lang);b.textContent='✓ '+b.dataset.lang}));}catch(e){console.error(e);status.textContent='Could not load this feature right now. Please try again shortly.'}}load();</script></body></html>
